<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOLIUM — Dossier</title>
<style>
  :root{--gold1:#8f6f2c;--gold2:#c79c43;--gold3:#f1d27a;--gold4:#a77d31;--bronze:#20180a;--bronze2:#3a2c14;--cream:#f6f2ea;}
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{margin:0;font-family:'Poppins',Arial,sans-serif;background:#e8e2d2;color:#2b2416;}
  .toolbar{position:sticky;top:0;background:var(--bronze);color:var(--gold3);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:50;}
  .toolbar button{background:linear-gradient(120deg,var(--gold1),var(--gold2));border:none;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;}

  /* ---- Formato orizzontale (A4 landscape), come il report reale di riferimento ---- */
  /* Dimensioni di default: verticale. applyTheme() le sovrascrive in orizzontale
     (max-width:1123px;min-height:794px) quando il cliente ha scelto quel formato
     in fase di creazione — vedi #themeStyle iniettato più sotto. */
  .page{width:100%;max-width:794px;min-height:1123px;max-height:1123px;background:#fff;margin:20px auto;box-shadow:0 6px 24px rgba(0,0,0,.15);position:relative;overflow:hidden;color:#5c4a20;}
  /* Nessuno sfondo: pagine bianche pulite, richiesta esplicita — prima era un
     leggero fondo crema (#fffdf8), tolto del tutto. */
  .page.pattern{background:#fff;}
  .page-inner{position:relative;z-index:2;padding:44px 48px 64px;}

  /* ---- Copertina: foto piena pagina, overlay da sinistra, titolo grande ---- */
  .cover{color:#fff;}
  /* Margine di sicurezza EXTRA sul fondo (non solo il padding standard di
     .page-inner): se il browser di chi stampa ha ancora i margini di stampa
     di default (non "Nessuno"), il contenuto ancorato in basso deve comunque
     restare ben dentro il bordo fisico della pagina, altrimenti trabocca
     sulla pagina successiva — è esattamente il bug del giro precedente. */
  .cover .cover-inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;gap:24px;padding:38px 48px 96px;}
  .cover::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(31,22,8,.80),rgba(31,22,8,.50),rgba(31,22,8,.12));z-index:1;}
  .cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
  .brand{font-size:26px;letter-spacing:.20em;color:var(--gold3);font-weight:300;}
  .brand-sub{margin-top:6px;font-size:9px;letter-spacing:.22em;color:var(--gold3);text-transform:uppercase;}
  .cover-client-logo{max-height:34px;max-width:140px;object-fit:contain;background:rgba(255,255,255,.94);padding:7px 12px;border-radius:3px;}
  .cover-kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold3);margin-bottom:18px;}
  .cover-title{max-width:640px;font-size:38px;line-height:1.12;font-weight:200;letter-spacing:.06em;text-transform:uppercase;color:#fdfbf5;margin:0;}
  .cover-meta{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold3);line-height:1.9;}

  /* ---- Header pagine di contenuto (non copertina) ---- */
  .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  /* Logo cliente nell'header di ogni pagina: box a dimensione FISSA (non dipende dalle
     dimensioni naturali del file caricato), background-image + background-size:contain
     invece di <img object-fit> — stesso motivo delle foto gallery: html2canvas non
     rispetta object-fit in modo affidabile e lo stirava durante l'esportazione PDF.
     "contain" ingrandisce automaticamente i loghi piccoli fino a riempire il box (mai
     tagliati) e gestisce da solo sia loghi quadrati che rettangolari, centrando sempre
     il risultato — nessun rilevamento manuale della forma necessario. */
  /* Box FISSO 230×110: il logo si ingrandisce fino a toccare almeno 2 bordi opposti del
     rettangolo (background-size:contain) SENZA MAI tagliare — è la proprietà giusta:
     "cover" avrebbe riempito tutti e 4 i bordi ma tagliando l'eccedenza, non richiesto. */
  .client-logo{width:230px;height:110px;background-position:center;background-repeat:no-repeat;background-size:contain;}
  .brand-mark{font-size:10px;letter-spacing:.20em;color:var(--gold4);text-transform:uppercase;}

  /* ---- Footer editoriale (page-folio), identico nome/stile al report reale ---- */
  .page-folio{position:absolute;left:48px;right:48px;bottom:18px;z-index:3;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(166,127,52,.6);}
  .page-folio.on-image{color:rgba(241,210,122,.85);}
  .page-footer-logo{height:42px;width:auto;opacity:1;margin-left:10px;display:inline-flex;align-items:center;}

  h1.title{font-weight:200;font-size:24px;letter-spacing:.06em;color:#2b2416;margin:0 0 6px;}
  .subtitle{font-size:12px;color:#8a7a52;margin-bottom:18px;letter-spacing:.03em;}

  /* ---- Etichetta di sezione: kicker + titolo + riga oro, identico al report reale ---- */
  .section-kicker{font-size:10px;letter-spacing:.30em;text-transform:uppercase;color:var(--gold4);margin-bottom:8px;}
  .section-title{font-size:22px;font-weight:300;letter-spacing:.12em;text-transform:uppercase;color:var(--gold4);margin:0 0 14px;}
  .lux-rule{height:1px;background:linear-gradient(to right,var(--gold2),transparent);margin:0 0 20px;}

  /* ---- Gallery foto: PAGINATA 2 per pagina, alta qualità, aspect-ratio fisso ---- */
  .gallery-photo-grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:6px;}
  .gallery-photo-cell{border:1px solid rgba(166,127,52,.18);border-radius:6px;background-color:#f6f1e4;background-position:center;background-repeat:no-repeat;background-size:contain;overflow:hidden;height:480px;box-shadow:0 6px 18px rgba(90,70,20,.10);}

  .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px;}
  .metric-card{border:1px solid rgba(166,127,52,.18);background:rgba(255,255,255,.5);padding:28px 22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;}
  .metric-label{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold4);line-height:1.35;}
  .metric-value{font-size:30px;font-weight:200;color:var(--gold4);line-height:1.05;margin-top:12px;}

  .data-table{width:100%;font-size:13px;border-collapse:collapse;}
  .data-table td{padding:9px 0;border-bottom:1px solid rgba(166,127,52,.12);}
  .data-table td:first-child{color:var(--gold4);width:40%;font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;}
  /* Grafico a barre orizzontali per demografia/redditi — coerente con lo stile
     Immonova di riferimento, niente librerie, solo div con width in %. */
  .bar-chart-row{display:grid;grid-template-columns:110px 1fr 50px;align-items:center;gap:12px;margin-bottom:12px;}
  .bar-chart-row .bar-label{font-size:11px;letter-spacing:.05em;color:var(--gold4);text-transform:uppercase;}
  .bar-chart-track{height:16px;background:rgba(166,127,52,.10);border-radius:2px;overflow:hidden;}
  .bar-chart-fill{height:100%;background:linear-gradient(90deg,var(--gold1),var(--gold2));border-radius:2px;}
  .bar-chart-row .bar-pct{font-size:12.5px;color:#5c4a20;text-align:right;}
  .contact-box{background:rgba(255,255,255,.5);border:1px solid rgba(166,127,52,.18);padding:16px 18px;font-size:13px;margin-top:20px;}
  /* Box per i dati inseriti manualmente (note/annessi/analisi): stesso stile a
     riquadro delle altre card dati, non più testo nudo senza contenitore. */
  .verified-note{font-size:14.5px;line-height:1.9;white-space:pre-wrap;color:#5c4a20;border:1px solid rgba(166,127,52,.18);background:rgba(255,255,255,.5);padding:26px 28px;min-height:70px;}
  /* ---- Posizione e mappa ---- */
  .location-layout{display:grid;grid-template-columns:.85fr 1.3fr;gap:24px;margin-top:8px;}
  .toc-list{margin-top:10px}
  .toc-row{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid rgba(166,127,52,.14);padding:14px 0;font-size:15px;color:#735f36;letter-spacing:.03em}
  .toc-row strong{color:var(--gold4);font-weight:600}
  .addr-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(166,127,52,.12);padding:9px 0;font-size:12.5px;color:var(--gold4);}
  .addr-row strong{color:var(--gold4);min-width:100px;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;}
  .map-frame{width:100%;height:340px;border:1px solid rgba(166,127,52,.2);display:block;object-fit:cover;}
  /* pagina pubblicitaria */
  .ad-page{background:linear-gradient(160deg,#fdf9ef,#f6ecd2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .ad-page .tag{font-size:9px;letter-spacing:.20em;color:#a4915c;margin-bottom:16px;text-transform:uppercase;}
  .ad-page img.ad-img{max-width:100%;max-height:420px;box-shadow:0 8px 24px rgba(0,0,0,.1);}
  .ad-page h2{font-weight:200;font-size:22px;letter-spacing:.04em;color:#2b2416;margin:16px 0 8px;}
  .ad-page p{font-size:13px;color:#5c4f30;max-width:440px;}
  .ad-page .cta{margin-top:14px;padding:10px 24px;background:linear-gradient(120deg,var(--gold1),var(--gold2));color:#fff;border-radius:24px;text-decoration:none;font-size:12px;letter-spacing:1px;}
  /* Forza margini di stampa a ZERO via codice: prima dipendevamo dal fatto che
     l'utente selezionasse "Margini: Nessuno" nel dialogo di stampa del browser —
     se restava sui margini predefiniti, l'ultimo pezzo di ogni .page (alto
     esattamente quanto una pagina A4) veniva tagliato fuori e spinto sulla
     pagina successiva. Con @page {margin:0} il browser non aggiunge margini
     di suo, la pagina intera (1123px=A4) entra sempre su un solo foglio. */
  @page { size: A4; margin: 0; }
  @media print {
    .toolbar{display:none;}
    .page{box-shadow:none;margin:0;page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid;page-break-before:avoid;}
    .page:last-child{page-break-after:auto;break-after:auto;}
    #devTierSimulatorView{display:none !important;}
  }
  .loading{text-align:center;padding:80px 20px;color:#8a7a52;}
  .lead-gate{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 30% 20%, var(--bronze2), var(--bronze));display:flex;align-items:center;justify-content:center;padding:20px;}
  .lead-gate-card{background:#fff;border-radius:16px;padding:32px 26px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .lead-gate-brand{font-weight:300;letter-spacing:4px;font-size:18px;background:linear-gradient(120deg,var(--gold1),var(--gold2),var(--gold3),var(--gold4));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;}
  .lead-gate-card h2{font-size:19px;font-weight:400;margin:0 0 8px;color:#2b2416;}
  .lead-gate-card p{font-size:13px;color:#8a7a52;line-height:1.6;margin:0 0 18px;}
  .lead-gate-card label{display:block;font-size:11px;letter-spacing:.5px;color:#8a7a52;margin:12px 0 5px;text-transform:uppercase;}
  .lead-gate-card input{width:100%;padding:11px 12px;border:1px solid #ddd2b3;border-radius:8px;font-size:14px;}
  .lead-gate-card button{width:100%;margin-top:18px;padding:13px;border:none;border-radius:9px;background:linear-gradient(120deg,var(--gold1),var(--gold2),var(--gold4));color:#fff;font-size:14px;letter-spacing:.5px;cursor:pointer;}
  .lead-gate-card button:disabled{opacity:.6;}
  .lead-gate-msg{font-size:12.5px;color:#a33;margin-top:10px;min-height:16px;}
  @media print { .lead-gate{display:none !important;} }
  .lang-switcher{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 16px;background:#fff;position:sticky;top:53px;z-index:40;border-bottom:1px solid #eee;}
  .lang-pill{border:1px solid #ddd2b3;border-radius:16px;padding:5px 14px;font-size:12px;cursor:pointer;background:#fff;color:#5c4f30;}
  .dev-tier-pill{border:1px solid #c9d9f5;border-radius:16px;padding:5px 14px;font-size:12px;cursor:pointer;background:#fff;color:#3a5a9c;}
  .dev-tier-pill.active{background:#3a5a9c;color:#fff;border-color:transparent;}
  .lang-pill.active{background:linear-gradient(120deg,var(--gold1),var(--gold2));color:#fff;border-color:transparent;}
  @media print { .lang-switcher{display:none;} }
</style>
<style id="themeStyle"></style>
</head>
<body>

<div class="toolbar">
  <div>FOLIUM</div>
  <div style="display:flex;gap:10px;">
    <button id="adminBtnView" style="display:none;background:transparent;border:1px solid var(--gold3);color:var(--gold3);" onclick="location.href='folium-admin.html'">Dashboard admin</button>
    <button id="editBtn" style="display:none;background:transparent;border:1px solid var(--gold3);color:var(--gold3);" onclick="goToEdit()">Modifica dossier</button>
    <button id="pdfBtn" onclick="generateServerPdf()" style="display:none;">Scarica PDF</button>
    <button id="shareBtn" onclick="shareDossierLink()" style="display:none;background:transparent;border:1px solid var(--gold3);color:var(--gold3);">Copia link</button>
    <button id="whatsappBtn" onclick="shareDossierWhatsapp()" style="display:none;background:#25D366;">Invia su WhatsApp</button>
    <button id="printBtn" onclick="window.print()" style="display:none;background:transparent;border:1px solid var(--gold3);color:var(--gold3);">Stampa dal browser</button>
  </div>
</div>

<div id="devTierSimulatorView" style="display:none;align-items:center;gap:8px;padding:8px 16px;background:#eef4ff;border-bottom:1px solid #c9d9f5;"></div>
<div id="langSwitcher" class="lang-switcher" style="display:none;"></div>

<div id="leadGate" class="lead-gate" style="display:none;">
  <div class="lead-gate-card">
    <div class="lead-gate-brand">FOLIUM</div>
    <h2>Scarica questo dossier</h2>
    <p>Lascia il tuo nome e la tua email per ricevere il link e avviare subito il download.</p>
    <label>Nome e cognome</label>
    <input type="text" id="leadName" required>
    <label>Email</label>
    <input type="email" id="leadEmail" required>
    <button id="leadSubmitBtn" onclick="submitLeadGate()">Sblocca e scarica</button>
    <div id="leadGateMsg" class="lead-gate-msg"></div>
  </div>
</div>

<div id="content" class="loading">
  <div style="text-align:center;padding:40px 20px;">
    <div style="font-size:13px;color:#8a7a52;margin-bottom:20px;">Caricamento dossier…</div>
    <div id="loadingSponsorBox" style="display:none;max-width:320px;margin:0 auto;background:#20180a;border-radius:14px;padding:16px;">
      <div style="font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#c79c43;margin-bottom:10px;">Nel frattempo</div>
      <div id="loadingSponsorSlide"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  const SUPABASE_URL = "https://jgsmebtiwgwegjcytmee.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ToGgNAX4tIn6O7gb6hMa4A_kRi1yztz";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Chiamate DIRETTE alle Edge Function di IMMONOVA (progetto separato, a pagamento).
  // Nessun deploy su Dominus: Dominus non ha un piano Supabase a pagamento proprio,
  // quindi si riusa l'infrastruttura Immonova via HTTP invece di duplicarla.
  // Solo lettura/consultazione — Immonova non viene mai toccato/modificato da qui.
  const IMMONOVA_URL = "https://bpzzmitmbavcmcasswbu.supabase.co";
  const IMMONOVA_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwenptaXRtYmF2Y21jYXNzd2J1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDk1ODQsImV4cCI6MjA5NzM4NTU4NH0.SkPicFpfYe69rI0JmASqm-jif-Ov3gQ0Mu20UbrYawY";
  const OWNER_EMAIL = "claudio.romano@bluewin.ch"; // account sviluppatore: vede sempre i contenuti Platinum

  // Widget pubblicità durante l'attesa iniziale (prima che il dossier vero appaia) —
  // richiesto esplicitamente: lo stesso momento di attesa esiste anche qui, non solo
  // durante la generazione. Parte subito, in parallelo al caricamento vero, si ferma da
  // sola quando il contenuto reale sostituisce #content (nessuna azione esplicita necessaria).
  (async function loadInitialLoadingSponsor(){
    try {
      const FIXED_TENANT_ID = "724f71d8-b499-46c1-9047-021280e913c9";
      const today = new Date().toISOString().slice(0, 10);
      const { data } = await sb.from('folium_ad_pages')
        .select('image_url, headline, folium_advertisers(name)')
        .eq('tenant_id', FIXED_TENANT_ID).eq('active', true)
        .lte('subscription_start', today).gte('subscription_end', today)
        .limit(8);
      if (!data || !data.length) return;
      const box = document.getElementById('loadingSponsorBox');
      const slide = document.getElementById('loadingSponsorSlide');
      if (!box || !slide) return; // il dossier vero è già apparso, non serve più
      box.style.display = 'block';
      let idx = 0;
      const renderSlide = () => {
        const ad = data[idx % data.length];
        slide.innerHTML = `<img src="${ad.image_url}" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;display:block;margin-bottom:8px;" alt="">
          <div style="font-size:11px;color:#e8dcb8;">${ad.folium_advertisers?.name || ''}${ad.headline ? ' — ' + ad.headline : ''}</div>`;
      };
      renderSlide();
      if (data.length > 1) setInterval(() => { idx++; if (document.getElementById('loadingSponsorSlide')) renderSlide(); }, 4000);
    } catch (e) { /* facoltativo, non deve mai bloccare il caricamento vero del dossier */ }
  })();

  // Mappa statica gratuita (piano Light): due tentativi precedenti falliti (dominio
  // staticmap.openstreetmap.de inesistente, poi MapTiler Static Maps che risulta
  // disponibile SOLO sui piani a pagamento anche col piano free attivo). Sostituito con
  // Geoapify Static Maps API (piano gratuito reale, 3000 richieste/giorno, nessuna carta),
  // testato dall'utente con richiesta diretta prima di essere cablato nel codice — CONFERMATO
  // funzionante 2026-09-02. Resta da confermare solo la cattura CORS dentro il PDF (html2canvas).
  const GEOAPIFY_KEY = "8ddfaf5a70914383939b99fa369a8dd5";

  // Servizi nelle vicinanze (scuole/ospedali/farmacie/supermercati) — Geoapify Places API,
  // GRATUITA (3.000 richieste/giorno sul piano free), stessa chiave già in uso per la mappa.
  // Nessuna cache su dossier.* per ora: chiamata una volta per rendering, costo trascurabile.
  async function ensureNearbyServices(lat, lng){
    try {
      const categories = 'education.school,healthcare.hospital,healthcare.pharmacy,commercial.supermarket';
      const url = `https://api.geoapify.com/v2/places?categories=${categories}&filter=circle:${lng},${lat},1500&bias=proximity:${lng},${lat}&limit=20&apiKey=${GEOAPIFY_KEY}`;
      const resp = await fetch(url);
      const json = await resp.json();
      if (!json.features) return null;
      return json.features.map(f => {
        const cats = f.properties.categories || [];
        let type = null;
        if (cats.includes('education.school')) type = 'school';
        else if (cats.includes('healthcare.hospital')) type = 'hospital';
        else if (cats.includes('healthcare.pharmacy')) type = 'pharmacy';
        else if (cats.includes('commercial.supermarket')) type = 'supermarket';
        if (!type) return null;
        return { type, name: f.properties.name || LABELS_FALLBACK[type], distance: f.properties.distance || 0 };
      }).filter(Boolean).sort((a, b) => a.distance - b.distance);
    } catch (e) {
      return null; // facoltativo: se Geoapify non risponde, il dossier si genera comunque senza questa sezione
    }
  }
  const LABELS_FALLBACK = { school: 'Scuola', hospital: 'Ospedale', pharmacy: 'Farmacia', supermarket: 'Supermercato' };

  async function callImmonovaFunction(name, body){
    const resp = await fetch(`${IMMONOVA_URL}/functions/v1/${name}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${IMMONOVA_ANON_KEY}`,
        'apikey': IMMONOVA_ANON_KEY
      },
      body: JSON.stringify(body)
    });
    if (!resp.ok) throw new Error(`Errore motore Immonova (${name}): ${await resp.text()}`);
    return resp.json();
  }

  const params = new URLSearchParams(window.location.search);
  const dossierId = params.get('id');

  function esc(s){ return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Impostata all'inizio di render(): true per Light e Gold (branding Folium),
  // false per Platinum. pageWrapper la legge per aggiungere il logo Folium in
  // basso a destra su OGNI pagina del dossier, comprese le pagine pubblicitarie.
  let currentShowFoliumBrand = false;
  let currentFooterText = 'FOLIUM'; // impostato in render() con l'indirizzo dell'immobile
  let currentSimulatedTier = 'light'; // DEFAULT SICURO: mai Platinum di default, altrimenti ogni apertura/refresh della pagina da parte tua richiama motori a pagamento senza che tu l'abbia scelto — causa reale della spesa imprevista. Vanno selezionati esplicitamente.
  // BUG REALE corretto: showMapError() (definita fuori da render()) usava la costante locale
  // isOwnerViewing dichiarata DENTRO render() — fuori scope, quindi ReferenceError silenzioso
  // ogni volta che provava a mostrare l'errore mappa (probabilmente interrompeva il resto del
  // rendering senza dirlo). Ora è una variabile di modulo, aggiornata a inizio render().
  let currentIsOwnerViewing = false;
  let currentPageOrientation = 'portrait'; // aggiornato in render(), usato dalla generazione PDF client-side
  // Anche scegliendo Gold/Platinum per test, i motori A PAGAMENTO (Discovery,
  // AI valuation, analyze-opportunity) NON partono più in automatico ad ogni
  // render/refresh: serve un consenso esplicito con questo pulsante, che resta
  // valido solo per la sessione corrente della scheda (si azzera ricaricando).
  let ownerAllowPaidCalls = false;

  function renderDevTierSimulator(activeTier){
    const box = document.getElementById('devTierSimulatorView');
    if (!box) return;
    box.style.display = 'flex';
    const labels = { light: 'Light', gold: 'Gold', platinum: 'Platinum' };
    // Il pulsante di consenso ora riguarda SOLO il Discovery Engine (Gold/Platinum, ancora
    // davvero facoltativo/costoso) — narrativa e profilo territoriale sono inclusi in OGNI
    // piano per decisione esplicita, quindi sempre attivi anche in Light, senza consenso.
    const paidNote = activeTier !== 'light'
      ? (ownerAllowPaidCalls
          ? `<span style="font-size:11px;color:#2f7d3a;margin-left:10px;">✓ Discovery Engine attivo per questo test</span>`
          : `<button onclick="allowPaidCallsAndRerender()" style="margin-left:10px;font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid #c0392b;background:#fff;color:#c0392b;cursor:pointer;">Genera Discovery Engine (costa reale, ~5,40€)</button>`)
      : '';
    box.innerHTML = `
      <span style="font-size:11px;letter-spacing:.5px;color:#3a5a9c;text-transform:uppercase;margin-right:6px;">Test come:</span>
      ${['light','gold','platinum'].map(t => `<div class="dev-tier-pill ${t === activeTier ? 'active' : ''}" onclick="switchDevTier('${t}')">${labels[t]}</div>`).join('')}
      ${paidNote}
    `;
  }

  function allowPaidCallsAndRerender(){ ownerAllowPaidCalls = true; render('it', currentSimulatedTier); }

  function switchDevTier(t){
    if (t !== currentSimulatedTier) ownerAllowPaidCalls = false; // cambiare piano azzera il consenso: va riconfermato
    render('it', t);
  }

  // Footer editoriale su ogni pagina interna (non sulla copertina, che ha già il
  // proprio blocco testo in basso): testo a sinistra + numero pagina a destra +
  // piccolo logo Folium se il piano lo prevede — stesso principio di Immonova
  // ("IMMONOVA · TITOLO" a sinistra, "N / TOT" a destra), coerente in tutto il documento.
  // Il numero di pagina reale non è ancora noto qui (le pagine si costruiscono in
  // sequenza): si usa un segnaposto {{PAGENUM}}/{{TOTALPAGES}}, sostituito con i
  // valori veri subito prima di mostrare il dossier finito.
  const FOLIUM_ICON_SVG = `<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" style="height:100%;width:auto;vertical-align:middle;">
    <circle cx="80" cy="80" r="78" fill="none" stroke="#a77d31" stroke-width="2.5"/>
    <path d="M50 34 H100 L112 46 V126 H50 Z" fill="none" stroke="#a77d31" stroke-width="3"/>
    <path d="M100 34 L100 46 H112 Z" fill="#a77d31"/>
    <path d="M64 58 H92 M64 58 V112 M64 82 H86" fill="none" stroke="#a77d31" stroke-width="4" stroke-linecap="round"/>
  </svg>`;

  function pageWrapper(inner, isAd, isCover, chapterLabel){
    if (isCover) return `<div class="page cover">${inner}</div>`;
    const logo = currentShowFoliumBrand
      ? `<span class="page-footer-logo">${FOLIUM_ICON_SVG}</span>`
      : '';
    // {{SPONSORS}}: sostituito a fine render() con "Con il supporto di: Nome1, Nome2" se il
    // dossier ha pubblicità attiva — presente su OGNI pagina (non solo quella dell'ad), così
    // il nome dell'inserzionista resta visibile anche se il cliente stampa/tiene solo alcune
    // pagine e scarta quelle pubblicitarie. Vuoto (rimosso) se non ci sono sponsor.
    const footer = `<div class="page-folio"><span>${esc(currentFooterText)}{{SPONSORS}}</span><span style="display:flex;align-items:center;">{{PAGENUM}} / {{TOTALPAGES}}${logo}</span></div>`;
    // chapterLabel: solo sulla PRIMA pagina di ogni sezione (mai sulle continuazioni
    // "(2/3)" o sulle foto successive alla prima) — usato per costruire il sommario con
    // i numeri di pagina reali, calcolati dopo l'inserimento delle pubblicità.
    const chapterAttr = chapterLabel ? ` data-chapter="${esc(chapterLabel)}"` : '';
    return `<div class="page ${isAd ? 'ad-page' : 'pattern'}"${chapterAttr}><div class="page-inner">${inner}</div>${footer}</div>`;
  }

  // Costruisce la pagina Sommario (stessa struttura del riferimento Immonova: kicker
  // "Contents", titolo "Sommario", elenco titolo+numero pagina) con i numeri REALI,
  // calcolati dopo aver assemblato l'ordine finale delle pagine incluse le pubblicità.
  function buildTocPage(entries, header){
    return pageWrapper(`
      ${header}
      ${sectionHead('Contents', 'Sommario')}
      <div class="toc-list">
        ${entries.map(e => `<div class="toc-row"><span>${esc(e.label)}</span><strong>${e.page}</strong></div>`).join('')}
      </div>
    `);
  }

  // Etichetta di sezione in 3 pezzi (kicker piccolo + titolo grande + riga oro),
  // esattamente come nel report Immonova di riferimento — riusata ovunque nel dossier.
  function sectionHead(kicker, title){
    return `<div class="section-kicker">${esc(kicker)}</div><div class="section-title">${esc(title)}</div><div class="lux-rule"></div>`;
  }

  // Grafico a barre orizzontali da un oggetto {etichetta: percentuale}, usato per
  // demografia/redditi al posto della tabella nuda — barra proporzionale al max.
  function barChartHTML(dataObj){
    const entries = Object.entries(dataObj || {});
    if (!entries.length) return '<div class="verified-note">Dati non disponibili.</div>';
    const max = Math.max(...entries.map(([, v]) => Number(v) || 0), 1);
    return entries.map(([label, value]) => `
        <div class="bar-chart-row">
          <div class="bar-label">${esc(label)}</div>
          <div class="bar-chart-track"><div class="bar-chart-fill" style="width:${Math.max(2, (Number(value) / max) * 100)}%;"></div></div>
          <div class="bar-pct">${esc(value)}%</div>
        </div>
      `).join('');
  }

  // Spezza un array in gruppi da "size" elementi — usato per la gallery foto,
  // che va SEMPRE paginata a 2 foto per pagina (mai tutte insieme in una griglia).
  function chunk(arr, size){
    const out = [];
    for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  // Spezza un testo lungo in blocchi che entrano in una pagina, SENZA mai tagliare
  // una parola o un paragrafo a metà — va sempre prima al paragrafo (doppio a capo),
  // poi alla frase (punto), solo come ultima risorsa alla parola. Prima di questa
  // funzione un testo troppo lungo veniva semplicemente TAGLIATO in silenzio da
  // overflow:hidden — bug reale, corretto qui.
  function paginateText(text, maxCharsPerPage){
    if (!text) return [];
    const paragraphs = text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    const pages = [];
    let current = '';
    for (const para of paragraphs) {
      if (para.length > maxCharsPerPage) {
        // Paragrafo singolo più lungo di una pagina intera: spezzo per frase.
        const sentences = para.match(/[^.!?]+[.!?]+|\S+$/g) || [para];
        for (const sent of sentences) {
          if ((current + '\n\n' + sent).trim().length > maxCharsPerPage && current) {
            pages.push(current.trim()); current = sent;
          } else {
            current = current ? current + ' ' + sent : sent;
          }
        }
        continue;
      }
      if ((current + '\n\n' + para).trim().length > maxCharsPerPage && current) {
        pages.push(current.trim()); current = para;
      } else {
        current = current ? current + '\n\n' + para : para;
      }
    }
    if (current.trim()) pages.push(current.trim());
    return pages;
  }

  // Sostituisce i segnaposto {{PAGENUM}}/{{TOTALPAGES}} nel footer di ogni pagina
  // (la copertina non ne ha, non passa da qui) con i numeri veri, noti solo ora
  // che l'intero dossier è stato costruito.
  function numberPages(list){
    const total = list.length;
    return list.map((html, i) => html.replaceAll('{{PAGENUM}}', String(i + 1)).replaceAll('{{TOTALPAGES}}', String(total)));
  }

  // Log ogni chiamata reale ai motori (per statistica admin "chi chiede cosa" e
  // controllo costi). Non blocca mai il dossier se il log stesso fallisce.
  async function logEngineCall(engineName, dossier, success){
    try {
      await sb.from('folium_engine_calls').insert({
        engine_name: engineName, dossier_id: dossier.id,
        client_id: dossier.client_id, tenant_id: dossier.tenant_id, success
      });
    } catch (e) { console.error('Log chiamata motore fallito:', e); }
  }

  // Dati generali del comune (popolazione/superficie/altitudine/vocazione territoriale) —
  // motore Immonova REALE (immonova-location-profile), chiamato COSÌ COM'È, nessuna modifica
  // al motore stesso. A PAGAMENTO (GeoNames gratis per popolazione/altitudine, ma la ricerca
  // OpenAI per la superficie parte comunque) — decisione esplicita: incluso anche su Light,
  // stesso principio della narrativa editoriale. Per l'account sviluppatore in test resta
  // dietro il consenso esplicito (dossier._editorialAllowed, stesso già usato per la narrativa).
  async function ensureTerritoryFacts(dossier){
    if (dossier.territory_facts) return { data: dossier.territory_facts, error: null };
    if (!dossier.property_city) return { data: null, error: null };
    if (!dossier._editorialAllowed) return { data: null, error: null }; // solo consenso mancante per l'account test, non un errore
    try {
      const data = await callImmonovaFunction('immonova-location-profile', {
        municipality: dossier.property_city,
        province: dossier.property_province,
        region: dossier.property_region,
        country: 'Italia',
        address: dossier.property_address,
        postal_code: dossier.property_postal_code,
        latitude: dossier.property_lat,
        longitude: dossier.property_lng
      });
      await logEngineCall('immonova-location-profile', dossier, !!data?.profile);
      if (!data?.profile) return { data: null, error: data?.error || 'Il motore ha risposto senza un profilo territoriale valido.' };
      const p = data.profile;
      const facts = {
        population: p.population ?? null,
        area_kmq: p.surface_kmq ?? null,
        altitude_m: p.altitude_m ?? null,
        density: p.density_per_kmq ?? null,
        territorial_vocation: p.territorial_vocation || null,
        narrative_ai: p.narrative || null // narrativa vera del motore, se disponibile — usata al posto del template se presente
      };
      if (!facts.population && !facts.area_kmq && !facts.altitude_m) return { data: null, error: 'immonova-location-profile non ha restituito nessun dato per questo comune.' };
      await sb.from('folium_dossiers').update({ territory_facts: facts }).eq('id', dossier.id);
      return { data: facts, error: null };
    } catch (e) {
      console.error('Motore profilo territoriale non disponibile:', e);
      await logEngineCall('immonova-location-profile', dossier, false);
      return { data: null, error: e.message || String(e) };
    }
  }
  // Narrativa breve costruita a partire dai numeri reali sopra — usata come RISERVA quando
  // il motore non fornisce una sua narrativa (facts.narrative_ai), altrimenti si usa quella.
  function buildTerritoryNarrative(city, province, facts){
    if (facts.narrative_ai) return facts.narrative_ai;
    const parts = [];
    parts.push(`${city}${province ? ' (' + province + ')' : ''} si trova in Puglia.`);
    if (facts.population) parts.push(`Conta una popolazione di circa ${Number(facts.population).toLocaleString('it-IT')} abitanti.`);
    if (facts.area_kmq) parts.push(`Si estende su una superficie di circa ${Number(facts.area_kmq).toLocaleString('it-IT')} km².`);
    if (facts.density) parts.push(`La densità abitativa è di circa ${facts.density.toLocaleString('it-IT')} abitanti per km².`);
    if (facts.altitude_m != null) parts.push(`Si trova a un'altitudine di circa ${facts.altitude_m} metri sul livello del mare.`);
    return parts.join(' ');
  }

  // Riusa immonova-demographics-engine chiamandolo DIRETTAMENTE sul progetto Immonova
  // (vedi callImmonovaFunction sopra). Stessa lezione di report-view.html Immonova:
  // verificare che il risultato contenga davvero age_distribution/income_distribution
  // prima di considerarlo valido, e cachare il risultato sul dossier per non richiamare
  // il motore ad ogni apertura.
  async function ensurePopulationComposition(dossier){
    if (dossier.population_composition?.age_distribution && dossier.population_composition?.income_distribution) {
      return { data: dossier.population_composition, error: null };
    }
    try {
      // Nomi parametri ESATTI attesi dal motore (letto dal codice sorgente):
      // body.municipality (o body.city), body.province, body.region, body.country_code
      // (default "IT" se omesso). Prima mandavamo comune/provincia/cap/regione — nessuna
      // di quelle chiavi esiste nel motore, quindi non trovava mai nulla: non era un
      // problema del comune specifico, erano i nomi dei parametri sbagliati.
      const data = await callImmonovaFunction('immonova-demographics-engine', {
        municipality: dossier.property_city, province: dossier.property_province,
        region: dossier.property_region
      });
      await logEngineCall('immonova-demographics-engine', dossier, !!data?.age_distribution);
      if (!data?.age_distribution) return { data: null, error: (data?.diagnostics?.cruscotto_italia_error || data?.diagnostics?.primary_source_note || 'Il motore ha risposto ma senza dati per "' + dossier.property_city + '".') };
      await sb.from('folium_dossiers').update({ population_composition: data }).eq('id', dossier.id);
      return { data, error: null };
    } catch (e) {
      console.error('Motore demografico non disponibile:', e);
      await logEngineCall('immonova-demographics-engine', dossier, false);
      return { data: null, error: e.message || String(e) };
    }
  }

  // immonova-ai-valuation-engine RIMOSSO da Folium: non è un motore per generare dossier
  // clienti, serve internamente per ricerche comparative sulle valutazioni immobiliari —
  // uso interno di Immonova, estraneo al prodotto Folium. Nessuna chiamata, nessuna sezione.

  // Riusa analyze-opportunity chiamandolo DIRETTAMENTE sul progetto Immonova. A PAGAMENTO
  // ma economico (~0,09€/chiamata: Claude Sonnet 4.5 + fino a 4 web search, verificato dal
  // codice sorgente) — DECISIONE ESPLICITA: incluso anche su Light per rendere presentabile
  // il dossier gratuito (e quindi le pagine pubblicitarie effettivamente viste dai lead).
  // Cache locale sul dossier per non richiamarlo ad ogni apertura della pagina.
  async function ensureEditorialAnalysis(dossier){
    if (dossier.editorial_analysis_result) return { data: dossier.editorial_analysis_result, error: null };
    if (!dossier._editorialAllowed) return { data: null, error: null }; // solo il consenso esplicito dell'account test manca, non un errore
    try {
      const data = await callImmonovaFunction('analyze-opportunity', {
        title: dossier.property_address,
        category: dossier.property_type,
        location: dossier.property_city,
        municipality: dossier.property_city,
        province: dossier.property_province,
        price: dossier.property_price,
        internal_size: dossier.property_size_sqm
      });
      await logEngineCall('analyze-opportunity', dossier, !!(data && data.success));
      if (!data || !data.success) return { data: null, error: (data && data.message) ? data.message : 'Il motore ha risposto senza successo (data.success falso o assente).' };
      await sb.from('folium_dossiers').update({ editorial_analysis_result: data.analysis }).eq('id', dossier.id);
      return { data: data.analysis, error: null };
    } catch (e) {
      console.error('Analisi editoriale non disponibile:', e);
      await logEngineCall('analyze-opportunity', dossier, false);
      return { data: null, error: e.message || String(e) };
    }
  }


  // Riusa immonova-discovery-engine chiamandolo DIRETTAMENTE sul progetto Immonova.
  // ATTENZIONE: è il motore "pesante" — dopo il resolver principale lancia sempre 6
  // chiamate parallele (accessibility/coastal/heritage/poi/global_demographics/
  // global_tourism), causa nota di WORKER_RESOURCE_LIMIT su Supabase. Per questo è
  // SEMPRE facoltativo (checkbox utente "Turismo, trasporti e territorio"), mai
  // chiamato di default come invece succede per la popolazione.
  async function ensureDiscoveryData(dossier){
    if (dossier.discovery_result) return dossier.discovery_result;
    if (!dossier._isPlatinum) return null; // sezione riservata a FOLIUM Platinum
    try {
      const data = await callImmonovaFunction('immonova-discovery-engine', {
        comune: dossier.property_city,
        provincia: dossier.property_province,
        cap: dossier.property_postal_code, regione: dossier.property_region,
        lat: dossier.property_lat, lng: dossier.property_lng
      });
      await logEngineCall('immonova-discovery-engine', dossier, !!data);
      if (!data) return null;
      await sb.from('folium_dossiers').update({ discovery_result: data }).eq('id', dossier.id);
      return data;
    } catch (e) {
      console.error('Discovery Engine non disponibile:', e);
      await logEngineCall('immonova-discovery-engine', dossier, false);
      return null;
    }

  // Carica la mappa statica Immonova (Gold/Platinum, a pagamento) via fetch autenticato
  // diretto — stesso identico pattern di report-view.html Immonova: mai un iframe live
  // per la mappa a pagamento (si stampa/scarica come immagine, non serve interattività).
  async function loadLocationMapImage(){
    const img = document.getElementById('locationMapImg');
    if (!img) return;
    const lat = img.getAttribute('data-lat'), lng = img.getAttribute('data-lng');
    if (!lat || !lng) return;
    try {
      const url = `${IMMONOVA_URL}/functions/v1/static-map-proxy?lat=${encodeURIComponent(lat)}&lng=${encodeURIComponent(lng)}&zoom=15&size=1200x700&scale=2`;
      const resp = await fetch(url, { headers: { 'Authorization': `Bearer ${IMMONOVA_ANON_KEY}`, 'apikey': IMMONOVA_ANON_KEY } });
      if (!resp.ok) {
        const errText = await resp.text();
        console.warn('Mappa posizione non caricata:', resp.status, errText);
        showMapError(img, `HTTP ${resp.status}: ${errText.slice(0, 200)}`);
        return;
      }
      const blob = await resp.blob();
      img.src = URL.createObjectURL(blob);
    } catch (e) {
      console.warn('Mappa posizione: errore fetch', e);
      showMapError(img, e.message || String(e));
    }
  }
  // Stesso pattern di errore visibile usato per demografia/discovery/territorio/editoriale:
  // prima un fallimento qui spariva in silenzio (solo console.warn), lasciando un riquadro
  // vuoto senza nessuna spiegazione — visibile SOLO all'account sviluppatore.
  function showMapError(img, message){
    if (!currentIsOwnerViewing) return;
    const box = img.parentElement;
    if (!box) return;
    img.style.display = 'none';
    const note = document.createElement('div');
    note.className = 'verified-note';
    note.style.color = '#a33';
    note.style.gridColumn = '2';
    note.textContent = `[Solo account test] Mappa non caricata: ${message}`;
    box.appendChild(note);
  }

  // Risolve il comune dell'immobile del dossier al suo codice ISTAT (una volta sola per
  // dossier, non per ogni slot) — serve a pickAdPage per mostrare solo pubblicità la cui
  // area di copertura include davvero questo comune, non pubblicità di un'altra regione.
  async function resolveDossierIstatCode(dossier){
    if (!dossier.property_city) return null;
    const { data } = await sb.from('folium_italy_comuni')
      .select('istat')
      .ilike('comune', dossier.property_city.trim())
      .maybeSingle();
    if (data) return data.istat;
    // Ambiguità (comune omonimo in più province) o nessun match diretto: prova a
    // restringere anche per provincia, se fornita.
    if (dossier.property_province) {
      const { data: data2 } = await sb.from('folium_italy_comuni')
        .select('istat')
        .ilike('comune', dossier.property_city.trim())
        .ilike('sigla_provincia', dossier.property_province.trim())
        .maybeSingle();
      if (data2) return data2.istat;
    }
    return null; // comune non riconosciuto: pickAdPage tratterà come "nessuna corrispondenza locale", mostra solo pubblicità nazionali
  }

  async function pickAdPage(tenantId, preferredSlot, excludeIds, dossierIstatCode){
    const today = new Date().toISOString().slice(0, 10);
    const { data: ads } = await sb.from('folium_ad_pages')
      .select('*, folium_advertisers(name)').eq('tenant_id', tenantId).eq('active', true)
      .lte('subscription_start', today).gte('subscription_end', today); // solo abbonamenti in corso, mai scaduti
    if (!ads || ads.length === 0) return null;

    // CORRETTO su richiesta esplicita: un inserzionista paga per uno slot preciso, deve
    // comparire SOLO in quello — mai in uno slot diverso, e mai ripetuto una seconda volta
    // nello stesso dossier solo perché gli altri erano già stati usati. Se per questo slot
    // non c'è (più) nessun inserzionista disponibile, quella posizione resta senza pubblicità
    // invece di mostrarne una sbagliata o duplicata.
    let inSlot = ads.filter(a => a.position_slot === preferredSlot && !excludeIds.includes(a.id));

    // FILTRO GEOGRAFICO: un annuncio con target_comuni vuoto/null copre tutta Italia,
    // sempre ammesso. Un annuncio con un'area specifica compare SOLO se il comune di
    // questo immobile è tra quelli coperti — un idraulico di Lecce non deve comparire
    // nel dossier di un immobile a Bergamo.
    inSlot = inSlot.filter(a => {
      if (!a.target_comuni || !a.target_comuni.length) return true; // tutta Italia
      if (!dossierIstatCode) return false; // area sconosciuta per questo dossier: gli annunci locali non si applicano
      return a.target_comuni.includes(dossierIstatCode);
    });
    if (!inSlot.length) return null;

    // selezione pesata semplice, solo tra gli inserzionisti di QUESTO slot
    const weighted = [];
    inSlot.forEach(a => { for (let i = 0; i < (a.weight || 1); i++) weighted.push(a); });
    return weighted[Math.floor(Math.random() * weighted.length)];
  }

  // Messaggio di diagnosi mostrato DIRETTAMENTE nella pagina (non solo in console,
  // troppo scomoda da usare) quando la traduzione non riesce — sotto il selettore
  // lingua, ben visibile, per non dover più usare gli strumenti sviluppatore.
  let lastTranslationDebugInfo = null;

  // Le 3 funzioni sotto sono PORTATE 1:1 dal codice di riferimento Immonova
  // (report-view.html), dove risolvono un problema reale già osservato in
  // produzione: mandare PIÙ testi in un solo array a translate-public-content fa
  // sì che il servizio a volte disallinei le risposte (ne salta una, o ne unisce
  // due), e da quel punto ogni chiave successiva riceve la traduzione sbagliata o
  // vuota — la funzione risponde comunque "success:true", quindi non è un errore
  // rilevabile dalla forma della risposta. La soluzione di Immonova (e ora anche di
  // Folium): UNA chiamata separata per ogni singolo testo, mai un array.
  function protectPlaceholders(text){
    const tokens = [];
    const protectedText = String(text).replace(/\{[a-zA-Z0-9_]+\}/g, (m) => { tokens.push(m); return '§' + (tokens.length - 1) + '§'; });
    return { text: protectedText, tokens };
  }
  function restorePlaceholders(text, tokens){
    if (!tokens.length) return text;
    return String(text).replace(/§(\d+)§/g, (m, idx) => { const t = tokens[Number(idx)]; return t != null ? t : m; });
  }
  function translationLooksSuspicious(source, candidate){
    if (candidate == null) return true;
    const srcTokens = (String(source).match(/\{[a-zA-Z0-9_]+\}/g) || []);
    for (const tok of srcTokens) { if (String(candidate).indexOf(tok) === -1) return true; }
    const srcLen = String(source).length;
    const candLen = String(candidate).length;
    if (srcLen > 20 && (candLen > srcLen * 4 || candLen < srcLen * 0.2)) return true;
    return false;
  }
  async function translateOneText(lang, text, context){
    if (!text) return '';
    const protectedItem = protectPlaceholders(text);
    let result = null;
    try {
      const data = await callImmonovaFunction('translate-public-content', {
        language: lang, source_language: 'it', context: context || '', texts: [protectedItem.text]
      });
      result = data;
    } catch (e) {
      lastTranslationDebugInfo = 'Chiamata al motore di traduzione fallita: ' + (e.message || String(e));
      return null;
    }
    if (!result || !result.success || !Array.isArray(result.translations) || result.translations.length !== 1) {
      lastTranslationDebugInfo = 'Risposta malformata dal motore di traduzione: ' + JSON.stringify(result);
      return null;
    }
    const raw = result.translations[0];
    if (raw == null) {
      lastTranslationDebugInfo = 'Il motore ha risposto "successo" ma con traduzione vuota per un testo.';
      return null;
    }
    return restorePlaceholders(raw, protectedItem.tokens);
  }

  async function ensureDynamicTranslation(dossier, lang){
    lastTranslationDebugInfo = null;
    if (lang === 'it') return null;

    const { data: editorial } = await ensureEditorialAnalysis(dossier);
    const disc = await ensureDiscoveryData(dossier);

    const SOURCE = {
      verified_notes: dossier.verified_data?.notes || '',
      full_description: editorial?.full_description || editorial?.short_description || '',
      location_summary: editorial?.location_summary || '',
      tourism_summary: editorial?.tourism_summary || '',
      discovery_summary: disc?.summary || disc?.narrative || '',
    };
    const keys = Object.keys(SOURCE);

    // Cache valida solo se ha tutte le chiavi e, per ogni testo sorgente non vuoto,
    // una traduzione corrispondente non vuota — una cache "completa ma vuota"
    // (salvata per errore in un tentativo precedente, prima di questa correzione)
    // va scartata e rigenerata, non trattata come già tradotta.
    const cached = dossier.translations && dossier.translations[lang];
    if (cached && keys.every(k => k in cached)) {
      const staleEmpty = keys.some(k => SOURCE[k] && !cached[k]);
      if (!staleEmpty) return cached;
    }

    if (!keys.some(k => SOURCE[k])) {
      lastTranslationDebugInfo = 'Nessun testo sorgente da tradurre trovato (narrativa editoriale non ancora generata su questo dossier).';
      return null;
    }

    const context = 'Dossier immobiliare FOLIUM per investitori privati.';
    const result = {};
    // Concorrenza limitata invece di 5 richieste tutte insieme in parallelo puro —
    // stesso principio di Immonova, gentile col motore anche quando in futuro le
    // chiavi da tradurre dovessero aumentare.
    const CONCURRENCY = 5;
    let idx = 0;
    async function worker(){
      while (idx < keys.length) {
        const i = idx++;
        const k = keys[i];
        const source = SOURCE[k];
        if (!source) { result[k] = ''; continue; }
        const translated = await translateOneText(lang, source, context);
        result[k] = translationLooksSuspicious(source, translated) ? '' : translated;
      }
    }
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, keys.length) }, worker));

    const updatedTranslations = { ...(dossier.translations || {}), [lang]: result };
    await sb.from('folium_dossiers').update({ translations: updatedTranslations }).eq('id', dossier.id);
    dossier.translations = updatedTranslations;
    return result;
  }

  function renderLanguageSwitcher(dossier, currentLang){
    const box = document.getElementById('langSwitcher');
    const langs = dossier.translated_languages || [];
    if (!langs.length) { box.style.display = 'none'; return; }
    box.style.display = 'flex';
    const names = { it:'Italiano', en:'English', fr:'Français', de:'Deutsch', es:'Español', ar:'العربية', zh:'中文' };
    const all = ['it', ...langs];
    box.innerHTML = all.map(l => `<div class="lang-pill ${l === currentLang ? 'active' : ''}" onclick="switchLanguage('${l}')">${names[l] || l}</div>`).join('');
  }

  function switchLanguage(lang){ render(lang); }

  async function render(lang, forcedTier){
    lang = lang || 'it';

    // generare un PDF/link SEPARATO per ogni lingua (prima un solo file/link
    // esisteva per l'intero dossier, e passare a un'altra lingua sovrascriveva

    currentLang = lang;

    currentFooterText = `FOLIUM · ${(dossier.property_address || '').toUpperCase()}`;

    const dataSources = new Set();

    const header = `
      <div class="page-header">

      </div>`;

    const pages = [];

    // Pagina 1 — copertina full-bleed: prima foto dell'immobile come sfondo, overlay

    const coverPhoto = propertyPhotos[0]?.photo_url;

    pages.push(pageWrapper(`
      ${coverPhoto ? `<img class="cover-bg" src="${esc(coverPhoto)}">` : `<div class="cover-bg" style="background:radial-gradient(circle at 30% 20%, var(--bronze2), var(--bronze));"></div>`}
      <div class="cover-inner">

    // Annessi/caratteristiche — integrati nella pagina "Sintesi dell'immobile" su

    const AMENITY_ICONS = { pool:'🏊', sea_view:'🌊', garden:'🌳', garage:'🚗', terrace:'🏛️', annex:'🏡', fireplace:'🔥', air_conditioning:'❄️', elevator:'🛗', gym:'🏋️', wine_cellar:'🍷', security:'🔒', solar_panels:'☀️', sea_access:'⚓', heating:'🌡️', habitability:'📋', parking:'🅿️', seafront:'🏖️', historic_center:'⛲' };

  // Il box del logo cliente ora si ADATTA alla forma reale del logo (quadrato o

  // ---- Lead gate: chi non è il proprietario del dossier (né l'account

  function goToEdit(){

  // Genera il PDF lato server (folium-generate-pdf), invece di dipendere dalla stampa
  // del browser: una sola chiamata, output identico su ogni dispositivo — pensata per
  // essere usata anche da un agente/assistente che lavora in autonomia, non solo da un
  // umano davanti al dialogo di stampa.
  // Genera il PDF DIRETTAMENTE NEL BROWSER, stessa identica tecnica già in produzione su
  // Immonova (report-view.html → generateDossierPdfBlob): html2canvas cattura ogni pagina
  // come immagine, jsPDF le assembla in un vero PDF con dimensioni fisse in mm. Aggira
  // COMPLETAMENTE il motore di stampa del browser (nessuna dipendenza da margini/scala/
  // impostazioni di Chrome o Safari — infatti su Immonova è identico su entrambi). Nessun
  // servizio esterno da configurare, nessun costo, funziona subito.
  async function renderDossierPageToCanvas(pageEl){
    try {
      return await html2canvas(pageEl, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
    } catch (err) {
      // bug noto di html2canvas 1.4.1 (Range.setEnd) — stesso fallback già in uso su Immonova
      const isRangeBug = err && /setEnd|Range/i.test(String(err.message || err));
      if (!isRangeBug) throw err;
      return await html2canvas(pageEl, { scale: 2, useCORS: true, backgroundColor: '#ffffff', foreignObjectRendering: true });
    }
  }
  function waitForImagesToLoad(root, timeoutMs){
    timeoutMs = timeoutMs || 8000;
    const imgs = Array.prototype.slice.call((root || document).querySelectorAll('img'));
    const imgPromises = imgs.map(img => {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(resolve => {
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        img.addEventListener('load', finish, { once: true });
        img.addEventListener('error', finish, { once: true });
        setTimeout(finish, timeoutMs);
      });
    });
    // Le foto della galleria sono ora background-image CSS (non <img>, per evitare il bug
    // di html2canvas con object-fit) — vanno precaricate a parte, altrimenti il canvas
    // potrebbe essere catturato prima che il browser abbia scaricato l'immagine di sfondo.
    const bgEls = Array.prototype.slice.call((root || document).querySelectorAll('.gallery-photo-cell, .client-logo'));
    const bgPromises = bgEls.map(el => {
      const m = (el.style.backgroundImage || '').match(/url\(['"]?(.*?)['"]?\)/);
      if (!m || !m[1]) return Promise.resolve();
      return new Promise(resolve => {
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        const preloadImg = new Image();
        preloadImg.addEventListener('load', finish, { once: true });
        preloadImg.addEventListener('error', finish, { once: true });
        preloadImg.src = m[1];
        setTimeout(finish, timeoutMs);
      });
    });
    return Promise.all([...imgPromises, ...bgPromises]);
  }
  async function generateDossierPdfBlob(){
    await waitForImagesToLoad(document.getElementById('content'), 8000);
    const pages = Array.prototype.slice.call(document.querySelectorAll('#content .page'));
    if (!pages.length) throw new Error('Nessuna pagina del dossier trovata da esportare.');
    const landscape = currentPageOrientation === 'landscape';
    const [w, h] = landscape ? [297, 210] : [210, 297]; // mm, coerente con l'orientamento scelto dal cliente
    const pdf = new window.jspdf.jsPDF({ orientation: landscape ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
    for (let i = 0; i < pages.length; i++) {
      const canvas = await renderDossierPageToCanvas(pages[i]);
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      if (i > 0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
    }
    return pdf.output('blob');
  }

  // Link condivisibile: STESSO approccio di Immonova (verificato dal codice di
  // riferimento) — NON la pagina web (richiederebbe JS + passa dal lead gate per chi non
  // è proprietario), ma un vero file PDF caricato su Storage con URL pubblico diretto:
  // si apre ovunque all'istante, mostra un'anteprima vera su WhatsApp, nessun login.
  // Riusa generateDossierPdfBlob() già esistente (stessa funzione di "Scarica PDF").
  let cachedShareUrl = {}; // una entry per lingua: {it: '...', en: '...', ...}
  let currentLang = 'it';

  function escHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function getOrGenerateShareablePdfUrl(statusEl){
    // Un dossier tradotto ha lingue diverse mostrate a persone diverse — ognuna deve
    // avere il proprio PDF e il proprio link, mai condividere lo stesso file/URL tra
    // lingue diverse (altrimenti l'ultima lingua generata sovrascrive le precedenti).
    const lang = currentLang;
    if (cachedShareUrl[lang]) return cachedShareUrl[lang];
    if (statusEl) statusEl.textContent = 'Generazione PDF in corso…';
    const blob = await generateDossierPdfBlob();
    const langSuffix = lang !== 'it' ? `-${lang}` : ''; // 'it' resta senza suffisso per compatibilità con i link italiani già condivisi in passato
    const filename = `${(currentFooterText.replace('FOLIUM · ', '') || 'dossier')}${langSuffix}.pdf`;
    const path = `dossier-${dossierId}/${filename}`;
    // cacheControl:'0' — STESSO bug già visto sulle edge function (vedi nota in cima al
    // file): senza questo, Supabase Storage applica il default (Cache-Control max-age
    // 3600) sull'oggetto, e la CDN davanti al bucket può continuare a servire i vecchi
    // byte anche dopo un upsert riuscito con contenuto corretto — un hard reload del
    // browser NON risolve, perché la cache stantia è lato server/edge, non lato client.
    // Bug reale trovato 2026-09-05: un dossier tradotto PRIMA del fix delle traduzioni
    // (quando mancavano 3 sezioni su 5) aveva già occupato questo stesso path — il
    // re-upload con la traduzione corretta non bastava a far vedere il PDF aggiornato.
    const { error } = await sb.storage.from('folium-dossier-pdfs').upload(path, blob, { contentType: 'application/pdf', upsert: true, cacheControl: '0' });
    if (error) throw error;
    const { data: pdfPub } = sb.storage.from('folium-dossier-pdfs').getPublicUrl(path);
    // Cache-buster anche sul PDF stesso (prima ce l'aveva solo la pagina HTML ponte
    // share/<id>-<lang>.html, mai il PDF a cui quella pagina reindirizza) — garantisce
    // che ogni nuova generazione sia raggiungibile con un URL "mai visto prima" dalla
    // CDN, invece di sperare che l'invalidazione post-upsert sia già propagata.
    const pdfUrl = `${pdfPub.publicUrl}?v=${Date.now()}`;

    // dossier/coverPhoto NON sono visibili qui (sono locali a render()) — query
    // dedicata e leggera, solo i 2 campi che servono per i tag della pagina ponte.
    const { data: shareDossier } = await sb.from('folium_dossiers').select('property_address').eq('id', dossierId).single();
    const { data: shareCoverPhotoRow } = await sb.from('folium_dossier_photos').select('photo_url').eq('dossier_id', dossierId).eq('photo_kind', 'property').order('sort_order').limit(1).maybeSingle();
    const rawCoverPhoto = shareCoverPhotoRow?.photo_url || '';
    const address = shareDossier?.property_address || 'Dossier immobiliare';

    // Copertina ridimensionata in un JPEG piccolo (max 1200px, qualità 0.82) —
    // stesso principio della copertina di riferimento Immonova (file reale
    // pre-generato, non l'originale potenzialmente pesante caricato dal cliente).
    let coverImageBase64 = null;
    if (rawCoverPhoto) {
      try {
        const img = await new Promise((resolve, reject) => {
          const im = new Image();
          im.crossOrigin = 'anonymous';
          im.onload = () => resolve(im);
          im.onerror = reject;
          im.src = rawCoverPhoto;
        });
        const maxW = 1200;
        const scale = Math.min(1, maxW / img.naturalWidth);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        coverImageBase64 = dataUrl.split(',')[1]; // solo la parte base64, senza "data:image/jpeg;base64,"
      } catch (e) {
        console.error('Ridimensionamento copertina condivisione fallito, si procede senza immagine:', e);
      }
    }

    // Pagina ponte pubblicata come file VERO sul dominio proprio
    // (folium.dominus-suite.it, repository GitHub) invece che su storage.supabase.co —
    // ogni link *.supabase.co testato oggi non ha mai mostrato l'anteprima su
    // WhatsApp nonostante contenuto/tag corretti (verificato col debugger Facebook),
    // mentre domini "normali" funzionano sempre: un dominio proprio elimina questa
    // variabile alla radice.
    const publishRes = await fetch(`${SUPABASE_URL}/functions/v1/folium-publish-share`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dossierId, address, pdfUrl, coverImageBase64, lang }),
    });
    const publishData = await publishRes.json();
    if (!publishRes.ok || !publishData.url) throw new Error(publishData.error || 'Pubblicazione della pagina di condivisione fallita');

    // Parametro "v" invisibile ma rende il link unico ad ogni nuova generazione:
    // WhatsApp ha una cache propria dell'anteprima per URL, separata da quella di
    // Facebook e senza uno strumento pubblico per svuotarla — un link "mai visto
    // prima" evita di restare bloccati su un'anteprima vecchia salvata durante i
    // test precedenti.
    cachedShareUrl[lang] = `${publishData.url}?v=${Date.now()}`;
    return cachedShareUrl[lang];
  }

  async function shareDossierLink(){
    const btn = document.getElementById('shareBtn');
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Preparazione link…';
    try {
      const url = await getOrGenerateShareablePdfUrl();
      await navigator.clipboard.writeText(url);
      btn.textContent = 'Link copiato ✓';
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2000);
    } catch (e) {
      alert('Non è stato possibile preparare il link: ' + (e.message || e));
      btn.textContent = original; btn.disabled = false;
    }
  }

  async function shareDossierWhatsapp(){
    const btn = document.getElementById('whatsappBtn');
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Preparazione…';
    try {
      const url = await getOrGenerateShareablePdfUrl();
      const address = currentFooterText.replace('FOLIUM · ', '') || 'questo immobile';
      const message = `Ecco il dossier di ${address}:\n${url}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
    } catch (e) {
      alert('Non è stato possibile preparare il PDF da inviare: ' + (e.message || e));
    } finally {
      btn.disabled = false; btn.textContent = original;
    }
  }

  async function generateServerPdf(){
    const btn = document.getElementById('pdfBtn');
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Generazione PDF in corso…';
    try {
      const blob = await generateDossierPdfBlob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `Folium - ${currentFooterText.replace('FOLIUM · ', '') || 'dossier'}.pdf`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (e) {
      alert('Generazione PDF non riuscita: ' + (e.message || e) + '\n\nPuoi comunque usare "Stampa dal browser" nel frattempo.');
    } finally {
      btn.disabled = false; btn.textContent = original;
    }
  }

  async function checkAccessAndRender(){
    const { data: dossier } = await sb.from('folium_dossiers').select('id, client_id, is_shared').eq('id', dossierId).single();
    if (!dossier) { document.getElementById('content').textContent = 'Dossier non trovato.'; return; }

    const { data: { user } } = await sb.auth.getUser();
    const isOwnerAccount = (user?.email || '').toLowerCase() === OWNER_EMAIL;
    const isDossierOwner = user && user.id === dossier.client_id;

    if (isOwnerAccount || isDossierOwner) {
      document.getElementById('printBtn').style.display = '';
      document.getElementById('pdfBtn').style.display = '';
      document.getElementById('shareBtn').style.display = '';
      document.getElementById('whatsappBtn').style.display = '';
      // Link alla dashboard admin: SOLO per l'account sviluppatore, mai per il
      // proprietario del dossier che sta semplicemente vedendo il proprio lavoro.
      if (isOwnerAccount) document.getElementById('adminBtnView').style.display = '';
      // "Modifica" solo per il vero proprietario del dossier — l'account sviluppatore
      // che sta solo TESTANDO il dossier di qualcun altro non deve poterlo modificare.
      if (isDossierOwner) document.getElementById('editBtn').style.display = '';
      render('it');
      return;
    }

    // Visitatore esterno (es. investitore a cui l'agente ha mandato il link): gate attivo.
    document.getElementById('content').innerHTML = '';
    document.getElementById('leadGate').style.display = 'flex';
  }

  async function submitLeadGate(){
    const name = document.getElementById('leadName').value.trim();
    const email = document.getElementById('leadEmail').value.trim();
    const msg = document.getElementById('leadGateMsg');
    const btn = document.getElementById('leadSubmitBtn');
    if (!name || !email) { msg.textContent = 'Inserisci nome ed email.'; return; }

    btn.disabled = true; btn.textContent = 'Sblocco in corso…';
    try {
      const { data: dossier } = await sb.from('folium_dossiers').select('tenant_id').eq('id', dossierId).single();
      const { error } = await sb.from('folium_dossier_leads').insert({
        dossier_id: dossierId, tenant_id: dossier?.tenant_id, name, email
      });
      if (error) throw error;

      document.getElementById('leadGate').style.display = 'none';
      document.getElementById('printBtn').style.display = '';
      await render('it');
      window.print(); // avvia subito il download/salvataggio PDF come richiesto
    } catch (e) {
      msg.textContent = 'Errore: ' + (e.message || e);
      btn.disabled = false; btn.textContent = 'Sblocca e scarica';
    }
  }

  // Ritorno da Stripe dopo il pagamento di una o più traduzioni (folium-translation-
  // checkout): NON procede col render normale finché il pagamento non risulta
  // 'completed' (aggiornato dal webhook Stripe) — altrimenti si rischierebbe di
  // mostrare il dossier come se le lingue nuove fossero già pronte quando magari il
  // webhook non ha ancora fatto in tempo a processare il pagamento.
  async function waitForTranslationPurchase(purchaseId){
    const content = document.getElementById('content');
    content.innerHTML = `<div style="text-align:center;padding:60px 20px;color:#8a7a52;">Conferma del pagamento traduzione in corso…<br><span style="font-size:12px;">Non chiudere questa pagina, di solito richiede pochi secondi.</span></div>`;

    const { data: purchase, error } = await sb.from('folium_translation_purchases').select('*').eq('id', purchaseId).maybeSingle();
    if (error || !purchase) {
      content.innerHTML = `<div style="text-align:center;padding:60px 20px;color:#a33;">Impossibile verificare il pagamento della traduzione. Se hai completato il pagamento, ricarica questa pagina tra qualche istante.</div>`;
      return;
    }
    if (purchase.status === 'completed') {
      // Query pulita, senza il parametro, per non ripetere il controllo ad ogni refresh
      const cleanUrl = window.location.href.split('?')[0] + `?id=${dossierId}`;
      window.history.replaceState({}, '', cleanUrl);
      return; // procede col checkAccessAndRender/render normale, sotto
    }
    if (purchase.status === 'failed') {
      content.innerHTML = `<div style="text-align:center;padding:60px 20px;color:#a33;">Il pagamento della traduzione non è andato a buon fine. Le lingue nuove non sono state aggiunte al dossier.</div>`;
      return;
    }
    // ancora 'pending': ricontrolla ogni 4 secondi, stesso pattern di folium-checkout-success.html
    setTimeout(() => waitForTranslationPurchase(purchaseId), 4000);
  }

  async function init(){
    const translationPurchaseId = new URLSearchParams(window.location.search).get('translation_purchase_id');
    if (translationPurchaseId) {
      await waitForTranslationPurchase(translationPurchaseId);
      // Se il pagamento non è ancora confermato, waitForTranslationPurchase resta in
      // attesa/polling e NON deve proseguire oltre in questa chiamata.
      const stillPending = new URLSearchParams(window.location.search).get('translation_purchase_id');
      if (stillPending) return;
    }
    checkAccessAndRender();
  }

  init();
</script>
</body>
</html>
