<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOLIUM — Dossier</title>
<style>
  :root{--gold1:#8f6f2c;--gold2:#c79c43;--gold3:#f1d27a;--gold4:#a77d31;--bronze:#20180a;--bronze2:#3a2c14;--cream:#f6f2ea;}
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{margin:0;font-family:'Poppins',Arial,sans-serif;background:#e8e2d2;color:#2b2416;}
  .toolbar{position:sticky;top:0;background:var(--bronze);color:var(--gold3);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:50;}
  .toolbar button{background:linear-gradient(120deg,var(--gold1),var(--gold2));border:none;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;}

  /* ---- Formato orizzontale (A4 landscape), come il report reale di riferimento ---- */
  /* Dimensioni di default: verticale. applyTheme() le sovrascrive in orizzontale
     (max-width:1123px;min-height:794px) quando il cliente ha scelto quel formato
     in fase di creazione — vedi #themeStyle iniettato più sotto. */
  .page{width:100%;max-width:794px;min-height:1123px;max-height:1123px;background:#fff;margin:20px auto;box-shadow:0 6px 24px rgba(0,0,0,.15);position:relative;overflow:hidden;color:#5c4a20;}
  /* Nessuno sfondo: pagine bianche pulite, richiesta esplicita — prima era un
     leggero fondo crema (#fffdf8), tolto del tutto. */
  .page.pattern{background:#fff;}
  .page-inner{position:relative;z-index:2;padding:44px 48px;}

  /* ---- Copertina: foto piena pagina, overlay da sinistra, titolo grande ---- */
  .cover{color:#fff;}
  /* Margine di sicurezza EXTRA sul fondo (non solo il padding standard di
     .page-inner): se il browser di chi stampa ha ancora i margini di stampa
     di default (non "Nessuno"), il contenuto ancorato in basso deve comunque
     restare ben dentro il bordo fisico della pagina, altrimenti trabocca
     sulla pagina successiva — è esattamente il bug del giro precedente. */
  .cover .cover-inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;gap:24px;padding:38px 48px 96px;}
  .cover::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(31,22,8,.80),rgba(31,22,8,.50),rgba(31,22,8,.12));z-index:1;}
  .cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
  .brand{font-size:26px;letter-spacing:.20em;color:var(--gold3);font-weight:300;}
  .brand-sub{margin-top:6px;font-size:9px;letter-spacing:.22em;color:var(--gold3);text-transform:uppercase;}
  .cover-client-logo{max-height:34px;max-width:140px;object-fit:contain;background:rgba(255,255,255,.94);padding:7px 12px;border-radius:3px;}
  .cover-kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold3);margin-bottom:18px;}
  .cover-title{max-width:640px;font-size:38px;line-height:1.12;font-weight:200;letter-spacing:.06em;text-transform:uppercase;color:#fdfbf5;margin:0;}
  .cover-meta{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold3);line-height:1.9;}

  /* ---- Header pagine di contenuto (non copertina) ---- */
  .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .client-logo{max-height:36px;max-width:140px;object-fit:contain;}
  .brand-mark{font-size:10px;letter-spacing:.20em;color:var(--gold4);text-transform:uppercase;}

  /* ---- Footer editoriale (page-folio), identico nome/stile al report reale ---- */
  .page-folio{position:absolute;left:48px;right:48px;bottom:18px;z-index:3;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(166,127,52,.6);}
  .page-folio.on-image{color:rgba(241,210,122,.85);}
  .page-footer-logo{height:42px;width:auto;opacity:1;margin-left:10px;display:inline-flex;align-items:center;}

  h1.title{font-weight:200;font-size:24px;letter-spacing:.06em;color:#2b2416;margin:0 0 6px;}
  .subtitle{font-size:12px;color:#8a7a52;margin-bottom:18px;letter-spacing:.03em;}

  /* ---- Etichetta di sezione: kicker + titolo + riga oro, identico al report reale ---- */
  .section-kicker{font-size:10px;letter-spacing:.30em;text-transform:uppercase;color:var(--gold4);margin-bottom:8px;}
  .section-title{font-size:22px;font-weight:300;letter-spacing:.12em;text-transform:uppercase;color:var(--gold4);margin:0 0 14px;}
  .lux-rule{height:1px;background:linear-gradient(to right,var(--gold2),transparent);margin:0 0 20px;}

  /* ---- Gallery foto: PAGINATA 2 per pagina, alta qualità, aspect-ratio fisso ---- */
  .gallery-photo-grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:6px;}
  .gallery-photo-cell{border:1px solid rgba(166,127,52,.18);background-color:#f4ecdf;background-position:center;background-repeat:no-repeat;background-size:contain;overflow:hidden;height:560px;}

  .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px;}
  .metric-card{border:1px solid rgba(166,127,52,.18);background:rgba(255,255,255,.5);padding:28px 22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;}
  .metric-label{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold4);line-height:1.35;}
  .metric-value{font-size:30px;font-weight:200;color:var(--gold4);line-height:1.05;margin-top:12px;}

  .data-table{width:100%;font-size:13px;border-collapse:collapse;}
  .data-table td{padding:9px 0;border-bottom:1px solid rgba(166,127,52,.12);}
  .data-table td:first-child{color:var(--gold4);width:40%;font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;}
  /* Grafico a barre orizzontali per demografia/redditi — coerente con lo stile
     Immonova di riferimento, niente librerie, solo div con width in %. */
  .bar-chart-row{display:grid;grid-template-columns:110px 1fr 50px;align-items:center;gap:12px;margin-bottom:12px;}
  .bar-chart-row .bar-label{font-size:11px;letter-spacing:.05em;color:var(--gold4);text-transform:uppercase;}
  .bar-chart-track{height:16px;background:rgba(166,127,52,.10);border-radius:2px;overflow:hidden;}
  .bar-chart-fill{height:100%;background:linear-gradient(90deg,var(--gold1),var(--gold2));border-radius:2px;}
  .bar-chart-row .bar-pct{font-size:12.5px;color:#5c4a20;text-align:right;}
  .contact-box{background:rgba(255,255,255,.5);border:1px solid rgba(166,127,52,.18);padding:16px 18px;font-size:13px;margin-top:20px;}
  /* Box per i dati inseriti manualmente (note/annessi/analisi): stesso stile a
     riquadro delle altre card dati, non più testo nudo senza contenitore. */
  .verified-note{font-size:14.5px;line-height:1.9;white-space:pre-wrap;color:#5c4a20;border:1px solid rgba(166,127,52,.18);background:rgba(255,255,255,.5);padding:26px 28px;min-height:70px;}
  /* ---- Posizione e mappa ---- */
  .location-layout{display:grid;grid-template-columns:.85fr 1.3fr;gap:24px;margin-top:8px;}
  .addr-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(166,127,52,.12);padding:9px 0;font-size:12.5px;color:var(--gold4);}
  .addr-row strong{color:var(--gold4);min-width:100px;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;}
  .map-frame{width:100%;height:340px;border:1px solid rgba(166,127,52,.2);display:block;object-fit:cover;}
  /* pagina pubblicitaria */
  .ad-page{background:linear-gradient(160deg,#fdf9ef,#f6ecd2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .ad-page .tag{font-size:9px;letter-spacing:.20em;color:#a4915c;margin-bottom:16px;text-transform:uppercase;}
  .ad-page img.ad-img{max-width:100%;max-height:420px;box-shadow:0 8px 24px rgba(0,0,0,.1);}
  .ad-page h2{font-weight:200;font-size:22px;letter-spacing:.04em;color:#2b2416;margin:16px 0 8px;}
  .ad-page p{font-size:13px;color:#5c4f30;max-width:440px;}
  .ad-page .cta{margin-top:14px;padding:10px 24px;background:linear-gradient(120deg,var(--gold1),var(--gold2));color:#fff;border-radius:24px;text-decoration:none;font-size:12px;letter-spacing:1px;}
  /* Forza margini di stampa a ZERO via codice: prima dipendevamo dal fatto che
     l'utente selezionasse "Margini: Nessuno" nel dialogo di stampa del browser —
     se restava sui margini predefiniti, l'ultimo pezzo di ogni .page (alto
     esattamente quanto una pagina A4) veniva tagliato fuori e spinto sulla
     pagina successiva. Con @page {margin:0} il browser non aggiunge margini
     di suo, la pagina intera (1123px=A4) entra sempre su un solo foglio. */
  @page { size: A4; margin: 0; }
  @media print {
    .toolbar{display:none;}
    .page{box-shadow:none;margin:0;page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid;page-break-before:avoid;}
    .page:last-child{page-break-after:auto;break-after:auto;}
    #devTierSimulatorView{display:none !important;}
  }
  .loading{text-align:center;padding:80px 20px;color:#8a7a52;}
  .lead-gate{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 30% 20%, var(--bronze2), var(--bronze));display:flex;align-items:center;justify-content:center;padding:20px;}
  .lead-gate-card{background:#fff;border-radius:16px;padding:32px 26px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .lead-gate-brand{font-weight:300;letter-spacing:4px;font-size:18px;background:linear-gradient(120deg,var(--gold1),var(--gold2),var(--gold3),var(--gold4));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;}
  .lead-gate-card h2{font-size:19px;font-weight:400;margin:0 0 8px;color:#2b2416;}
  .lead-gate-card p{font-size:13px;color:#8a7a52;line-height:1.6;margin:0 0 18px;}
  .lead-gate-card label{display:block;font-size:11px;letter-spacing:.5px;color:#8a7a52;margin:12px 0 5px;text-transform:uppercase;}
  .lead-gate-card input{width:100%;padding:11px 12px;border:1px solid #ddd2b3;border-radius:8px;font-size:14px;}
  .lead-gate-card button{width:100%;margin-top:18px;padding:13px;border:none;border-radius:9px;background:linear-gradient(120deg,var(--gold1),var(--gold2),var(--gold4));color:#fff;font-size:14px;letter-spacing:.5px;cursor:pointer;}
  .lead-gate-card button:disabled{opacity:.6;}
  .lead-gate-msg{font-size:12.5px;color:#a33;margin-top:10px;min-height:16px;}
  @media print { .lead-gate{display:none !important;} }
  .lang-switcher{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 16px;background:#fff;position:sticky;top:53px;z-index:40;border-bottom:1px solid #eee;}
  .lang-pill{border:1px solid #ddd2b3;border-radius:16px;padding:5px 14px;font-size:12px;cursor:pointer;background:#fff;color:#5c4f30;}
  .dev-tier-pill{border:1px solid #c9d9f5;border-radius:16px;padding:5px 14px;font-size:12px;cursor:pointer;background:#fff;color:#3a5a9c;}
  .dev-tier-pill.active{background:#3a5a9c;color:#fff;border-color:transparent;}
  .lang-pill.active{background:linear-gradient(120deg,var(--gold1),var(--gold2));color:#fff;border-color:transparent;}
  @media print { .lang-switcher{display:none;} }
</style>
<style id="themeStyle"></style>
</head>
<body>

<div class="toolbar">
  <div>FOLIUM</div>
  <div style="display:flex;gap:10px;">
    <button id="adminBtnView" style="display:none;background:transparent;border:1px solid var(--gold3);color:var(--gold3);" onclick="location.href='folium-admin.html'">Dashboard admin</button>
    <button id="editBtn" style="display:none;background:transparent;border:1px solid var(--gold3);color:var(--gold3);" onclick="goToEdit()">Modifica dossier</button>
    <button id="pdfBtn" onclick="generateServerPdf()" style="display:none;">Scarica PDF</button>
    <button id="printBtn" onclick="window.print()" style="display:none;background:transparent;border:1px solid var(--gold3);color:var(--gold3);">Stampa dal browser</button>
  </div>
</div>

<div id="devTierSimulatorView" style="display:none;align-items:center;gap:8px;padding:8px 16px;background:#eef4ff;border-bottom:1px solid #c9d9f5;"></div>
<div id="langSwitcher" class="lang-switcher" style="display:none;"></div>

<div id="leadGate" class="lead-gate" style="display:none;">

</div>

<div id="content" class="loading">Caricamento dossier…</div>

<script>
  const SUPABASE_URL = "https://jgsmebtiwgwegjcytmee.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ToGgNAX4tIn6O7gb6hMa4A_kRi1yztz";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Chiamate DIRETTE alle Edge Function di IMMONOVA (progetto separato, a pagamento).
  // Nessun deploy su Dominus: Dominus non ha un piano Supabase a pagamento proprio,
  // quindi si riusa l'infrastruttura Immonova via HTTP invece di duplicarla.
  // Solo lettura/consultazione — Immonova non viene mai toccato/modificato da qui.
  const IMMONOVA_URL = "https://bpzzmitmbavcmcasswbu.supabase.co";
  const IMMONOVA_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwenptaXRtYmF2Y21jYXNzd2J1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDk1ODQsImV4cCI6MjA5NzM4NTU4NH0.SkPicFpfYe69rI0JmASqm-jif-Ov3gQ0Mu20UbrYawY";
  const OWNER_EMAIL = "claudio.romano@bluewin.ch"; // account sviluppatore: vede sempre i contenuti Platinum

  async function callImmonovaFunction(name, body){
    const resp = await fetch(`${IMMONOVA_URL}/functions/v1/${name}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${IMMONOVA_ANON_KEY}`,
        'apikey': IMMONOVA_ANON_KEY
      },
      body: JSON.stringify(body)
    });
    if (!resp.ok) throw new Error(`Errore motore Immonova (${name}): ${await resp.text()}`);
    return resp.json();
  }

  const params = new URLSearchParams(window.location.search);
  const dossierId = params.get('id');

  function esc(s){ return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Impostata all'inizio di render(): true per Light e Gold (branding Folium),
  // false per Platinum. pageWrapper la legge per aggiungere il logo Folium in
  // basso a destra su OGNI pagina del dossier, comprese le pagine pubblicitarie.
  let currentShowFoliumBrand = false;
  let currentFooterText = 'FOLIUM'; // impostato in render() con l'indirizzo dell'immobile
  let currentSimulatedTier = 'light'; // DEFAULT SICURO: mai Platinum di default, altrimenti ogni apertura/refresh della pagina da parte tua richiama motori a pagamento senza che tu l'abbia scelto — causa reale della spesa imprevista. Vanno selezionati esplicitamente.
  let currentPageOrientation = 'portrait'; // aggiornato in render(), usato dalla generazione PDF client-side
  // Anche scegliendo Gold/Platinum per test, i motori A PAGAMENTO (Discovery,
  // AI valuation, analyze-opportunity) NON partono più in automatico ad ogni
  // render/refresh: serve un consenso esplicito con questo pulsante, che resta
  // valido solo per la sessione corrente della scheda (si azzera ricaricando).
  let ownerAllowPaidCalls = false;

  function renderDevTierSimulator(activeTier){
    const box = document.getElementById('devTierSimulatorView');
    if (!box) return;
    box.style.display = 'flex';
    const labels = { light: 'Light', gold: 'Gold', platinum: 'Platinum' };
    // Il pulsante di consenso ora riguarda SOLO il Discovery Engine (Gold/Platinum, ancora
    // davvero facoltativo/costoso) — narrativa e profilo territoriale sono inclusi in OGNI
    // piano per decisione esplicita, quindi sempre attivi anche in Light, senza consenso.
    const paidNote = activeTier !== 'light'
      ? (ownerAllowPaidCalls
          ? `<span style="font-size:11px;color:#2f7d3a;margin-left:10px;">✓ Discovery Engine attivo per questo test</span>`
          : `<button onclick="allowPaidCallsAndRerender()" style="margin-left:10px;font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid #c0392b;background:#fff;color:#c0392b;cursor:pointer;">Genera Discovery Engine (costa reale, ~5,40€)</button>`)
      : '';
    box.innerHTML = `
      <span style="font-size:11px;letter-spacing:.5px;color:#3a5a9c;text-transform:uppercase;margin-right:6px;">Test come:</span>
      ${['light','gold','platinum'].map(t => `<div class="dev-tier-pill ${t === activeTier ? 'active' : ''}" onclick="switchDevTier('${t}')">${labels[t]}</div>`).join('')}
      ${paidNote}
    `;
  }

  function allowPaidCallsAndRerender(){ ownerAllowPaidCalls = true; render('it', currentSimulatedTier); }

  function switchDevTier(t){
    if (t !== currentSimulatedTier) ownerAllowPaidCalls = false; // cambiare piano azzera il consenso: va riconfermato
    render('it', t);
  }

  // Footer editoriale su ogni pagina interna (non sulla copertina, che ha già il
  // proprio blocco testo in basso): testo a sinistra + numero pagina a destra +
  // piccolo logo Folium se il piano lo prevede — stesso principio di Immonova
  // ("IMMONOVA · TITOLO" a sinistra, "N / TOT" a destra), coerente in tutto il documento.
  // Il numero di pagina reale non è ancora noto qui (le pagine si costruiscono in
  // sequenza): si usa un segnaposto {{PAGENUM}}/{{TOTALPAGES}}, sostituito con i
  // valori veri subito prima di mostrare il dossier finito.
  const FOLIUM_ICON_SVG = `<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" style="height:100%;width:auto;vertical-align:middle;">
    <circle cx="80" cy="80" r="78" fill="none" stroke="#a77d31" stroke-width="2.5"/>
    <path d="M50 34 H100 L112 46 V126 H50 Z" fill="none" stroke="#a77d31" stroke-width="3"/>
    <path d="M100 34 L100 46 H112 Z" fill="#a77d31"/>
    <path d="M64 58 H92 M64 58 V112 M64 82 H86" fill="none" stroke="#a77d31" stroke-width="4" stroke-linecap="round"/>
  </svg>`;

  function pageWrapper(inner, isAd, isCover){
    if (isCover) return `<div class="page cover">${inner}</div>`;
    const logo = currentShowFoliumBrand
      ? `<span class="page-footer-logo">${FOLIUM_ICON_SVG}</span>`
      : '';
    // {{SPONSORS}}: sostituito a fine render() con "Con il supporto di: Nome1, Nome2" se il
    // dossier ha pubblicità attiva — presente su OGNI pagina (non solo quella dell'ad), così
    // il nome dell'inserzionista resta visibile anche se il cliente stampa/tiene solo alcune
    // pagine e scarta quelle pubblicitarie. Vuoto (rimosso) se non ci sono sponsor.
    const footer = `<div class="page-folio"><span>${esc(currentFooterText)}{{SPONSORS}}</span><span style="display:flex;align-items:center;">{{PAGENUM}} / {{TOTALPAGES}}${logo}</span></div>`;
    return `<div class="page ${isAd ? 'ad-page' : 'pattern'}"><div class="page-inner">${inner}</div>${footer}</div>`;
  }

  // Etichetta di sezione in 3 pezzi (kicker piccolo + titolo grande + riga oro),
  // esattamente come nel report Immonova di riferimento — riusata ovunque nel dossier.
  function sectionHead(kicker, title){
    return `<div class="section-kicker">${esc(kicker)}</div><div class="section-title">${esc(title)}</div><div class="lux-rule"></div>`;
  }

  // Grafico a barre orizzontali da un oggetto {etichetta: percentuale}, usato per
  // demografia/redditi al posto della tabella nuda — barra proporzionale al max.
  function barChartHTML(dataObj){
    const entries = Object.entries(dataObj || {});
    if (!entries.length) return '<div class="verified-note">Dati non disponibili.</div>';
    const max = Math.max(...entries.map(([, v]) => Number(v) || 0), 1);
    return entries.map(([label, value]) => `
        <div class="bar-chart-row">
          <div class="bar-label">${esc(label)}</div>
          <div class="bar-chart-track"><div class="bar-chart-fill" style="width:${Math.max(2, (Number(value) / max) * 100)}%;"></div></div>
          <div class="bar-pct">${esc(value)}%</div>
        </div>
      `).join('');
  }

  // Spezza un array in gruppi da "size" elementi — usato per la gallery foto,
  // che va SEMPRE paginata a 2 foto per pagina (mai tutte insieme in una griglia).
  function chunk(arr, size){
    const out = [];
    for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  // Spezza un testo lungo in blocchi che entrano in una pagina, SENZA mai tagliare
  // una parola o un paragrafo a metà — va sempre prima al paragrafo (doppio a capo),
  // poi alla frase (punto), solo come ultima risorsa alla parola. Prima di questa
  // funzione un testo troppo lungo veniva semplicemente TAGLIATO in silenzio da
  // overflow:hidden — bug reale, corretto qui.
  function paginateText(text, maxCharsPerPage){
    if (!text) return [];
    const paragraphs = text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    const pages = [];
    let current = '';
    for (const para of paragraphs) {
      if (para.length > maxCharsPerPage) {
        // Paragrafo singolo più lungo di una pagina intera: spezzo per frase.
        const sentences = para.match(/[^.!?]+[.!?]+|\S+$/g) || [para];
        for (const sent of sentences) {
          if ((current + '\n\n' + sent).trim().length > maxCharsPerPage && current) {
            pages.push(current.trim()); current = sent;
          } else {
            current = current ? current + ' ' + sent : sent;
          }
        }
        continue;
      }
      if ((current + '\n\n' + para).trim().length > maxCharsPerPage && current) {
        pages.push(current.trim()); current = para;
      } else {
        current = current ? current + '\n\n' + para : para;
      }
    }
    if (current.trim()) pages.push(current.trim());
    return pages;
  }

  // Sostituisce i segnaposto {{PAGENUM}}/{{TOTALPAGES}} nel footer di ogni pagina
  // (la copertina non ne ha, non passa da qui) con i numeri veri, noti solo ora
  // che l'intero dossier è stato costruito.
  function numberPages(list){
    const total = list.length;
    return list.map((html, i) => html.replaceAll('{{PAGENUM}}', String(i + 1)).replaceAll('{{TOTALPAGES}}', String(total)));
  }

  // motore Immonova REALE (immonova-location-profile), chiamato COSÌ COM'È, nessuna modifica
  // al motore stesso. A PAGAMENTO (GeoNames gratis per popolazione/altitudine, ma la ricerca
  // OpenAI per la superficie parte comunque) — decisione esplicita: incluso anche su Light,
  // stesso principio della narrativa editoriale. Per l'account sviluppatore in test resta
  // dietro il consenso esplicito (dossier._editorialAllowed, stesso già usato per la narrativa).
  async function ensureTerritoryFacts(dossier){
    if (dossier.territory_facts) return { data: dossier.territory_facts, error: null };
    if (!dossier.property_city) return { data: null, error: null };
    if (!dossier._editorialAllowed) return { data: null, error: null }; // solo consenso mancante per l'account test, non un errore
    try {
      const data = await callImmonovaFunction('immonova-location-profile', {
        municipality: dossier.property_city,
        province: dossier.property_province,
        region: dossier.property_region,
        country: 'Italia',
        address: dossier.property_address,
        postal_code: dossier.property_postal_code,
        latitude: dossier.property_lat,
        longitude: dossier.property_lng
      });
      await logEngineCall('immonova-location-profile', dossier, !!data?.profile);
      if (!data?.profile) return { data: null, error: data?.error || 'Il motore ha risposto senza un profilo territoriale valido.' };
      const p = data.profile;
      const facts = {
        population: p.population ?? null,
        area_kmq: p.surface_kmq ?? null,
        altitude_m: p.altitude_m ?? null,
        density: p.density_per_kmq ?? null,
        territorial_vocation: p.territorial_vocation || null,
        narrative_ai: p.narrative || null // narrativa vera del motore, se disponibile — usata al posto del template se presente
      };
      if (!facts.population && !facts.area_kmq && !facts.altitude_m) return { data: null, error: 'immonova-location-profile non ha restituito nessun dato per questo comune.' };
      await sb.from('folium_dossiers').update({ territory_facts: facts }).eq('id', dossier.id);
      return { data: facts, error: null };
    } catch (e) {
      console.error('Motore profilo territoriale non disponibile:', e);
      await logEngineCall('immonova-location-profile', dossier, false);
      return { data: null, error: e.message || String(e) };
    }
  }
  // Narrativa breve costruita a partire dai numeri reali sopra — usata come RISERVA quando
  // il motore non fornisce una sua narrativa (facts.narrative_ai), altrimenti si usa quella.
  function buildTerritoryNarrative(city, province, facts){
    if (facts.narrative_ai) return facts.narrative_ai;
    const parts = [];
    parts.push(`${city}${province ? ' (' + province + ')' : ''} si trova in Puglia.`);
    if (facts.population) parts.push(`Conta una popolazione di circa ${Number(facts.population).toLocaleString('it-IT')} abitanti.`);
    if (facts.area_kmq) parts.push(`Si estende su una superficie di circa ${Number(facts.area_kmq).toLocaleString('it-IT')} km².`);
    if (facts.density) parts.push(`La densità abitativa è di circa ${facts.density.toLocaleString('it-IT')} abitanti per km².`);
    if (facts.altitude_m != null) parts.push(`Si trova a un'altitudine di circa ${facts.altitude_m} metri sul livello del mare.`);
    return parts.join(' ');
  }

  async function ensurePopulationComposition(dossier){

      // (default "IT" se omesso). Prima mandavamo comune/provincia/cap/regione — nessuna

  async function ensureEditorialAnalysis(dossier){

  // Carica la mappa statica Immonova (Gold/Platinum, a pagamento) via fetch autenticato
  // diretto — stesso identico pattern di report-view.html Immonova: mai un iframe live
  // per la mappa a pagamento (si stampa/scarica come immagine, non serve interattività).
  async function loadLocationMapImage(){
    const img = document.getElementById('locationMapImg');
    if (!img) return;
    const lat = img.getAttribute('data-lat'), lng = img.getAttribute('data-lng');
    if (!lat || !lng) return;
    try {
      const url = `${IMMONOVA_URL}/functions/v1/static-map-proxy?lat=${encodeURIComponent(lat)}&lng=${encodeURIComponent(lng)}&zoom=15&size=1200x700&scale=2`;
      const resp = await fetch(url, { headers: { 'Authorization': `Bearer ${IMMONOVA_ANON_KEY}`, 'apikey': IMMONOVA_ANON_KEY } });
      if (!resp.ok) { console.warn('Mappa posizione non caricata:', resp.status, await resp.text()); return; }
      const blob = await resp.blob();
      img.src = URL.createObjectURL(blob);
    } catch (e) {
      console.warn('Mappa posizione: errore fetch', e);
    }
  }

  async function pickAdPage(tenantId, preferredSlot, excludeIds){
    const today = new Date().toISOString().slice(0, 10);
    const { data: ads } = await sb.from('folium_ad_pages')
      .select('*, folium_advertisers(name)').eq('tenant_id', tenantId).eq('active', true)
      .lte('subscription_start', today).gte('subscription_end', today); // solo abbonamenti in corso, mai scaduti
    if (!ads || ads.length === 0) return null;

    // CORRETTO su richiesta esplicita: un inserzionista paga per uno slot preciso, deve
    // comparire SOLO in quello — mai in uno slot diverso, e mai ripetuto una seconda volta
    // nello stesso dossier solo perché gli altri erano già stati usati. Se per questo slot
    // non c'è (più) nessun inserzionista disponibile, quella posizione resta senza pubblicità
    // invece di mostrarne una sbagliata o duplicata.
    const inSlot = ads.filter(a => a.position_slot === preferredSlot && !excludeIds.includes(a.id));
    if (!inSlot.length) return null;

    // selezione pesata semplice, solo tra gli inserzionisti di QUESTO slot
    const weighted = [];
    inSlot.forEach(a => { for (let i = 0; i < (a.weight || 1); i++) weighted.push(a); });
    return weighted[Math.floor(Math.random() * weighted.length)];
  }

  async function ensureDynamicTranslation(dossier, lang){
    if (lang === 'it') return null;
    const cached = dossier.translations && dossier.translations[lang];
    if (cached) return cached;

    const verifiedNotes = dossier.verified_data?.notes || '';
    const discoverySummary = dossier.discovery_result?.summary || dossier.discovery_result?.narrative || '';
    const texts = [verifiedNotes, '', discoverySummary]; // indice 1 lasciato vuoto: era ai_narrative, motore non più usato in Folium — mantengo gli indici 0/2 stabili per non rompere la cache traduzioni già salvata
    if (!texts.some(x => x)) return null;

    try {
      const data = await callImmonovaFunction('translate-public-content', {
        language: lang, source_language: 'it',
        context: 'Dossier immobiliare FOLIUM per investitori privati.',
        texts
      });
      if (!data?.success || !Array.isArray(data.translations)) return null;
      const result = { verified_notes: data.translations[0] || '', ai_narrative: data.translations[1] || '', discovery_summary: data.translations[2] || '' };
      const updatedTranslations = { ...(dossier.translations || {}), [lang]: result };

  async function render(lang, forcedTier){
    lang = lang || 'it';
    const el = document.getElementById('content');
    const { data: dossier, error } = await sb.from('folium_dossiers').select('*').eq('id', dossierId).single();
    if (error || !dossier) { el.textContent = 'Dossier non trovato.'; return; }

    // Usa sempre il tier ATTUALE del cliente (non tier_at_generation), perché se ha
    // esaurito i crediti dopo aver creato il dossier le sezioni a costo non vanno più
    // rigenerate da zero (restano comunque visibili se già in cache su ai_valuation_result/
    // discovery_result, salvate quando il dossier fu creato in piano pieno).
    const { data: { user: viewerUser } } = await sb.auth.getUser();
    const isOwnerViewing = (viewerUser?.email || '').toLowerCase() === OWNER_EMAIL;
    let tier = 'light';
    if (isOwnerViewing) {
      renderDevTierSimulator(forcedTier || currentSimulatedTier);
      tier = forcedTier || currentSimulatedTier;
      currentSimulatedTier = tier;
    }
    else if (client?.plan !== 'light' && client?.credits_remaining > 0) tier = client.plan;
    dossier._isPlatinum = (tier !== 'light') && (!isOwnerViewing || ownerAllowPaidCalls); // sblocca i motori PAGATI riservati a Gold/Platinum (Discovery): cliente reale Gold/Platinum, o account test con consenso esplicito
    // Narrativa editoriale + profilo territoriale: DECISIONE ESPLICITA, motori inclusi in
    // OGNI piano (Light compreso) — quindi devono essere SEMPRE attivi, anche testando con

    // Se il dossier ha pubblicità, il pulsante "Stampa dal browser" resta nascosto: quel

    const pages = [];

      <div class="cover-inner">

        </div>
      </div>
    `, false, true));

    // Pagina 2 — presentazione: dati sintetici in metric-card + contatti, stile
    // editoriale (kicker + titolo + riga oro), come la pagina di riferimento.
    pages.push(pageWrapper(`
      ${header}
      ${sectionHead('Editorial Overview', "Sintesi dell'immobile")}
      <div class="metric-grid">
        <div class="metric-card"><div class="metric-label">Tipologia</div><div class="metric-value" style="font-size:16px;">${esc(dossier.property_type)}</div></div>
        <div class="metric-card"><div class="metric-label">Superficie</div><div class="metric-value">${dossier.property_size_sqm ? esc(dossier.property_size_sqm) + ' mq' : '—'}</div></div>
        <div class="metric-card"><div class="metric-label">Prezzo richiesto</div><div class="metric-value" style="font-size:18px;">${dossier.property_price ? '€ ' + Number(dossier.property_price).toLocaleString('it-IT') : 'Su richiesta'}</div></div>
      </div>
      <div class="contact-box">
        <b>${esc(client?.company_name || client?.full_name)}</b><br>
        ${esc(client?.contact_email)} · ${esc(client?.contact_phone)}
      </div>
    `));

    // Posizione e mappa — indirizzo sempre mostrato (dato gratuito, nessuna chiamata
    // esterna). La mappa invece: Light usa SOLO OpenStreetMap (iframe embed gratuito,
    // nessuna chiave, nessun costo — rispetta la regola "Light solo servizi gratuiti");
    // Gold/Platinum usano la mappa statica Immonova (Google Static Maps, a pagamento,
    // più curata con i punti di interesse), stesso pattern static-map-proxy del report
    // Immonova di riferimento, richiamata via callImmonovaFunction (mai deploy su Dominus).
    if (dossier.property_address) {
      dossier.property_lat = dossier.property_lat != null ? Number(dossier.property_lat) : null;
      dossier.property_lng = dossier.property_lng != null ? Number(dossier.property_lng) : null;
      const hasCoords = Number.isFinite(dossier.property_lat) && Number.isFinite(dossier.property_lng);
      const mapQueryStr = [dossier.property_address, dossier.property_city, dossier.property_province, 'Italia'].filter(Boolean).join(', ');
      let mapHTML;
      if (tier === 'light' || !hasCoords) {
        // Sempre gratuito: OpenStreetMap via bbox se abbiamo lat/lng, altrimenti query testuale.
        const osmSrc = hasCoords
          ? `https://www.openstreetmap.org/export/embed.html?bbox=${dossier.property_lng-0.01}%2C${dossier.property_lat-0.008}%2C${dossier.property_lng+0.01}%2C${dossier.property_lat+0.008}&marker=${dossier.property_lat}%2C${dossier.property_lng}&layer=mapnik`
          : `https://www.openstreetmap.org/export/embed.html?layer=mapnik`;
        mapHTML = `<iframe class="map-frame" src="${osmSrc}" loading="lazy"></iframe>`;
      } else {
        mapHTML = `<img class="map-frame" id="locationMapImg" data-lat="${esc(String(dossier.property_lat))}" data-lng="${esc(String(dossier.property_lng))}">`;
      }
      const addrRow = (label, val) => val ? `<div class="addr-row"><strong>${esc(label)}</strong><span>${esc(val)}</span></div>` : '';
      pages.push(pageWrapper(`
        ${header}
        ${sectionHead('Asset Location', 'Posizione e localizzazione')}
        <div class="location-layout">
          <div>
            ${addrRow('Indirizzo', dossier.property_address)}
            ${addrRow('CAP', dossier.property_postal_code)}
            ${addrRow('Comune', dossier.property_city)}
            ${addrRow('Provincia', dossier.property_province)}
            ${addrRow('Regione', dossier.property_region)}
          </div>
          ${mapHTML}
        </div>
      `));
    }

    // Pagine foto immobile — PAGINATE 2 per pagina (mai tutte insieme), logo cliente
    // già bruciato via watermark nel file al momento dell'upload (Light: cliente+Folium;
    // Gold/Platinum: solo cliente), qui SOLO 1 foto per pagina, grande e MAI deformata
    // (background-image + background-size:contain, non <img object-fit> — html2canvas non
    // rispetta object-fit in modo affidabile e stirava le foto durante l'esportazione PDF).
    if (propertyPhotos.length) {
      chunk(propertyPhotos, 1).forEach((pair, idx) => {
        pages.push(pageWrapper(`
          ${header}
          ${idx === 0 ? sectionHead('Media Gallery', t('photos', lang)) : sectionHead('Media Gallery', `${t('photos', lang)} (${idx + 1})`)}
          <div class="gallery-photo-grid">
            ${pair.map(p => `<div class="gallery-photo-cell" style="background-image:url('${esc(p.photo_url)}');"></div>`).join('')}
          </div>
        `));
      });
    }

    // Caratteristiche e annessi — pittogrammi per Gold/Platinum, testo libero per Light
    const AMENITY_ICONS = { pool:'🏊', sea_view:'🌊', garden:'🌳', garage:'🚗', terrace:'🏛️', annex:'🏡', fireplace:'🔥', air_conditioning:'❄️', elevator:'🛗', gym:'🏋️', wine_cellar:'🍷', security:'🔒', solar_panels:'☀️', sea_access:'⚓' };
    const AMENITY_LABELS_IT = { pool:'Piscina', sea_view:'Vista mare', garden:'Giardino', garage:'Garage', terrace:'Terrazza', annex:'Annesso/Dependance', fireplace:'Camino', air_conditioning:'Aria condizionata', elevator:'Ascensore', gym:'Palestra', wine_cellar:'Cantina vini', security:'Sistema di sicurezza', solar_panels:'Pannelli solari', sea_access:'Accesso privato al mare' };
    if (tier !== 'light' && (dossier.amenities || []).length) {
      pages.push(pageWrapper(`
        ${header}
        ${sectionHead('Asset Characteristics', 'Caratteristiche e annessi')}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px;">
          ${dossier.amenities.map(code => `
            <div style="display:flex;align-items:center;gap:12px;font-size:14px;">
              <span style="font-size:22px;">${AMENITY_ICONS[code] || '•'}</span>
              <span>${esc(AMENITY_LABELS_IT[code] || code)}</span>
            </div>
          `).join('')}
        </div>
      `));
    } else if (tier === 'light' && dossier.amenities_description) {
      // Il cliente Light scrive un testo libero separato da virgole: ogni pezzo
      // diventa un box a sé, coerente con lo stile a pittogrammi di Gold/Platinum
      // invece di un unico paragrafo indistinto.
      const items = dossier.amenities_description.split(',').map(s => s.trim()).filter(Boolean);
      pages.push(pageWrapper(`
        ${header}
        ${sectionHead('Asset Characteristics', 'Caratteristiche e annessi')}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px;">
          ${items.map(item => `<div class="verified-note" style="padding:16px 18px;font-size:13.5px;">${esc(item)}</div>`).join('')}
        </div>
      `));
    }

    // Pagina dati verificati
    const verifiedText = (lang !== 'it' && translated?.verified_notes) || dossier.verified_data?.notes || 'Nessun dato aggiuntivo inserito.';
    pages.push(pageWrapper(`
      ${header}
      ${sectionHead('Verified Data', t('verified', lang))}
      <div class="verified-note">${esc(verifiedText)}</div>
    `));

    // Pagine foto destinazione (facoltative) — stessa regola: 1 foto per pagina, mai deformata
    if (destPhotos.length) {
      chunk(destPhotos, 1).forEach((pair, idx) => {
        pages.push(pageWrapper(`
          ${header}
          ${idx === 0 ? sectionHead('Location Gallery', t('destination', lang)) : sectionHead('Location Gallery', `${t('destination', lang)} (${idx + 1})`)}
          <div class="gallery-photo-grid">
            ${pair.map(p => `<div class="gallery-photo-cell" style="background-image:url('${esc(p.photo_url)}');"></div>`).join('')}
          </div>
        `));
      });
    }

    // Composizione popolazione (età/reddito) — sempre inclusa, motore leggero/gratuito
    const { data: popData, error: popError } = await ensurePopulationComposition(dossier);
    if (popData) {
      pages.push(pageWrapper(`
        ${header}
        ${sectionHead('Demographics', t('population', lang))}
        ${barChartHTML(popData.age_distribution?.percentages || {})}
        <div class="section-kicker" style="margin-top:30px;">${t('income', lang)}</div>
        ${barChartHTML(popData.income_distribution?.percentages || {})}
      `));
    } else if (isOwnerViewing && popError) {
      // Visibile SOLO all'account sviluppatore: dice la causa vera invece di sparire in
      // silenzio, così il test dice esattamente cosa non va (es. comune non riconosciuto).
      pages.push(pageWrapper(`
        ${header}
        ${sectionHead('Demographics', t('population', lang))}
        <div class="verified-note" style="color:#a33;">[Solo account test] Dati demografici non disponibili: ${esc(popError)}</div>
      `));
    }

    // Dati generali del territorio (popolazione/superficie/altitudine + vocazione territoriale)
    // — motore Immonova reale (immonova-location-profile), A PAGAMENTO, incluso su ogni piano.
    const { data: territory, error: territoryError } = await ensureTerritoryFacts(dossier);
    if (territory) {
      pages.push(pageWrapper(`
        ${header}
        ${sectionHead('Territory Data', 'Dati del territorio')}
        <div class="verified-note" style="margin-bottom:20px;">${esc(buildTerritoryNarrative(dossier.property_city, dossier.property_province, territory))}</div>
        <div class="metric-grid">
          ${territory.population ? `<div class="metric-card"><div class="metric-label">Popolazione</div><div class="metric-value">${Number(territory.population).toLocaleString('it-IT')}</div></div>` : ''}
          ${territory.area_kmq ? `<div class="metric-card"><div class="metric-label">Superficie</div><div class="metric-value">${Number(territory.area_kmq).toLocaleString('it-IT')} km²</div></div>` : ''}
          ${territory.altitude_m != null ? `<div class="metric-card"><div class="metric-label">Altitudine</div><div class="metric-value">${territory.altitude_m} m</div></div>` : ''}
        </div>
      `));
    } else if (isOwnerViewing && territoryError) {
      pages.push(pageWrapper(`
        ${header}
        ${sectionHead('Territory Data', 'Dati del territorio')}
        <div class="verified-note" style="color:#a33;">[Solo account test] Dati territoriali generali non disponibili: ${esc(territoryError)}</div>
      `));
    }

    // "Analisi di mercato AI" RIMOSSA da Folium (vedi nota su ensureAiValuation più sopra):
    // quel motore serve alle tue ricerche comparative interne, non ai dossier dei clienti.

    // Descrizione editoriale — INCLUSA SU TUTTI I PIANI (Light incluso, decisione esplicita:
    // motore economico ~0,09€, rende presentabile anche il dossier gratuito). Per l'account
    // sviluppatore in test, comunque dietro consenso esplicito (vedi dossier._editorialAllowed).
    // Ogni parte (descrizione, zona, turismo) ha la propria pagina dedicata, paginata
    // se il testo non entra in una pagina sola — mai più tagliata in silenzio.
    if (dossier.include_editorial_analysis || isOwnerViewing) {
      const { data: editorial, error: editorialError } = await ensureEditorialAnalysis(dossier);
      if (editorial) {
        const MAX_CHARS = 2600;
        const addTextPages = (kicker, title, text) => {
          const parts = paginateText(text, MAX_CHARS);
          parts.forEach((part, idx) => {
            pages.push(pageWrapper(`
              ${header}
              ${sectionHead(kicker, parts.length > 1 ? `${title} (${idx + 1}/${parts.length})` : title)}
              <div class="verified-note">${esc(part)}</div>
            `));
          });
        };
        addTextPages('Editorial Overview', 'Presentazione della proposta', editorial.full_description || editorial.short_description || '');
        if (editorial.location_summary) addTextPages('Editorial Overview', 'Attrattività della zona', editorial.location_summary);
        if (editorial.tourism_summary) addTextPages('Editorial Overview', 'Contesto turistico', editorial.tourism_summary);
      } else if (isOwnerViewing && editorialError) {
        pages.push(pageWrapper(`
          ${header}
          ${sectionHead('Editorial Overview', 'Presentazione della proposta')}
          <div class="verified-note" style="color:#a33;">[Solo account test] Analisi editoriale non disponibile: ${esc(editorialError)}</div>
        `));
      }
    }

    // Turismo, trasporti e territorio — sempre incluso per Gold/Platinum (motore pesante, o simulato dall'account test)
    if (dossier.include_discovery || (isOwnerViewing && tier !== 'light')) {
      const disc = await ensureDiscoveryData(dossier);
      if (disc) {
        const territoryText = (lang !== 'it' && translated?.discovery_summary) || disc.summary || disc.narrative || 'Dati territoriali non disponibili per questa zona.';
        const territoryParts = paginateText(territoryText, 2600);
        territoryParts.forEach((part, idx) => {
          pages.push(pageWrapper(`
            ${header}
            ${sectionHead('Location Intelligence', territoryParts.length > 1 ? `${t('territory', lang)} (${idx + 1}/${territoryParts.length})` : t('territory', lang))}
            <div class="verified-note">${esc(part)}</div>
          `));
        });
      } else if (isOwnerViewing) {
        // Visibile SOLO all'account sviluppatore: dice perché manca invece di sparire.
        pages.push(pageWrapper(`
          ${header}
          ${sectionHead('Location Intelligence', t('territory', lang))}
          <div class="verified-note" style="color:#a33;">[Solo account test] Sezione territorio non generata: il motore discovery non ha risposto o non ha trovato dati per questa zona.</div>
        `));
      }
    }

    // Pagina finale — riepilogo agenzia/agente: indirizzo, nome, contatti. Sempre inclusa,
    // ogni piano, è informazione del cliente stesso (nessun motore, nessun costo).
    pages.push(pageWrapper(`
      ${header}
      ${sectionHead('Agency Contact', 'Riepilogo agenzia')}
      <div class="metric-grid" style="grid-template-columns:1fr 1fr;">
        <div class="metric-card"><div class="metric-label">Agenzia / Agente</div><div class="metric-value" style="font-size:16px;">${esc(client?.company_name || client?.full_name || '—')}</div></div>
        <div class="metric-card"><div class="metric-label">Email</div><div class="metric-value" style="font-size:16px;">${esc(client?.contact_email || '—')}</div></div>
        <div class="metric-card"><div class="metric-label">Telefono</div><div class="metric-value" style="font-size:16px;">${esc(client?.contact_phone || '—')}</div></div>
        <div class="metric-card"><div class="metric-label">Indirizzo immobile di riferimento</div><div class="metric-value" style="font-size:16px;">${esc(dossier.property_address || '—')}</div></div>
      </div>
    `));

    // Inserimento pagine pubblicitarie tra una sezione e l'altra (Light e Gold)
    if (showAds) {
      const usedAdIds = [];
      const sponsorNames = []; // raccolti qui, stampati poi nel footer di OGNI pagina
      const finalPages = [];
      let slotNumber = 0;
      for (let i = 0; i < pages.length; i++) {
        finalPages.push(pages[i]);
        if (i < pages.length - 1) {
          slotNumber++; // slot 1 = subito dopo la prima pagina (copertina), poi 2,3...
          const ad = await pickAdPage(dossier.tenant_id, slotNumber, usedAdIds);
          if (ad) {
            usedAdIds.push(ad.id);
            const advertiserName = ad.folium_advertisers?.name;
            if (advertiserName && !sponsorNames.includes(advertiserName)) sponsorNames.push(advertiserName);
            finalPages.push(pageWrapper(`
              <div class="tag">${t('dedicated', lang)}</div>
              <img class="ad-img" src="${esc(ad.image_url)}">
              ${ad.headline ? `<h2>${esc(ad.headline)}</h2>` : ''}
              ${ad.subtext ? `<p>${esc(ad.subtext)}</p>` : ''}
              ${ad.cta_text && ad.cta_url ? `<a class="cta" href="${esc(ad.cta_url)}" target="_blank">${esc(ad.cta_text)}</a>` : ''}
            `, true));
            try { await sb.from('folium_ad_impressions').insert({ ad_page_id: ad.id, dossier_id: dossierId }); }
            catch (e) { console.error('Log impressione pubblicità fallito (non bloccante):', e); }
          }
        }
      }
      const sponsorFooterText = sponsorNames.length ? `  ·  Con il supporto di: ${sponsorNames.join(', ')}` : '';
      el.innerHTML = numberPages(finalPages).map(html => html.replaceAll('{{SPONSORS}}', esc(sponsorFooterText))).join('');
    } else {
      el.innerHTML = numberPages(pages).map(html => html.replaceAll('{{SPONSORS}}', '')).join('');
    }
    loadLocationMapImage(); // no-op se non c'è un <img id="locationMapImg"> (Light o senza coordinate)
  }

  // ---- Lead gate: chi non è il proprietario del dossier (né l'account
  // sviluppatore) deve lasciare nome+email prima di vedere/scaricare il
  // dossier. Il proprietario passa dritto: ha già i suoi dati su Folium.
  function goToEdit(){
    window.location.href = `folium-create.html?edit=${encodeURIComponent(dossierId)}`;
  }

  // Genera il PDF lato server (folium-generate-pdf), invece di dipendere dalla stampa
  // del browser: una sola chiamata, output identico su ogni dispositivo — pensata per
  // essere usata anche da un agente/assistente che lavora in autonomia, non solo da un
  // umano davanti al dialogo di stampa.
  // Genera il PDF DIRETTAMENTE NEL BROWSER, stessa identica tecnica già in produzione su
  // Immonova (report-view.html → generateDossierPdfBlob): html2canvas cattura ogni pagina
  // come immagine, jsPDF le assembla in un vero PDF con dimensioni fisse in mm. Aggira
  // COMPLETAMENTE il motore di stampa del browser (nessuna dipendenza da margini/scala/
  // impostazioni di Chrome o Safari — infatti su Immonova è identico su entrambi). Nessun
  // servizio esterno da configurare, nessun costo, funziona subito.
  async function renderDossierPageToCanvas(pageEl){
    try {
      return await html2canvas(pageEl, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
    } catch (err) {
      // bug noto di html2canvas 1.4.1 (Range.setEnd) — stesso fallback già in uso su Immonova
      const isRangeBug = err && /setEnd|Range/i.test(String(err.message || err));
      if (!isRangeBug) throw err;
      return await html2canvas(pageEl, { scale: 2, useCORS: true, backgroundColor: '#ffffff', foreignObjectRendering: true });
    }
  }
  function waitForImagesToLoad(root, timeoutMs){
    timeoutMs = timeoutMs || 8000;
    const imgs = Array.prototype.slice.call((root || document).querySelectorAll('img'));
    const imgPromises = imgs.map(img => {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(resolve => {
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        img.addEventListener('load', finish, { once: true });
        img.addEventListener('error', finish, { once: true });
        setTimeout(finish, timeoutMs);
      });
    });
    // Le foto della galleria sono ora background-image CSS (non <img>, per evitare il bug
    // di html2canvas con object-fit) — vanno precaricate a parte, altrimenti il canvas
    // potrebbe essere catturato prima che il browser abbia scaricato l'immagine di sfondo.
    const bgEls = Array.prototype.slice.call((root || document).querySelectorAll('.gallery-photo-cell'));
    const bgPromises = bgEls.map(el => {
      const m = (el.style.backgroundImage || '').match(/url\(['"]?(.*?)['"]?\)/);
      if (!m || !m[1]) return Promise.resolve();
      return new Promise(resolve => {
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        const preloadImg = new Image();
        preloadImg.addEventListener('load', finish, { once: true });
        preloadImg.addEventListener('error', finish, { once: true });
        preloadImg.src = m[1];
        setTimeout(finish, timeoutMs);
      });
    });
    return Promise.all([...imgPromises, ...bgPromises]);
  }
  async function generateDossierPdfBlob(){
    await waitForImagesToLoad(document.getElementById('content'), 8000);
    const pages = Array.prototype.slice.call(document.querySelectorAll('#content .page'));
    if (!pages.length) throw new Error('Nessuna pagina del dossier trovata da esportare.');
    const landscape = currentPageOrientation === 'landscape';
    const [w, h] = landscape ? [297, 210] : [210, 297]; // mm, coerente con l'orientamento scelto dal cliente
    const pdf = new window.jspdf.jsPDF({ orientation: landscape ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
    for (let i = 0; i < pages.length; i++) {
      const canvas = await renderDossierPageToCanvas(pages[i]);
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      if (i > 0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
    }
    return pdf.output('blob');
  }

  async function generateServerPdf(){
    const btn = document.getElementById('pdfBtn');
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Generazione PDF in corso…';
    try {
      const blob = await generateDossierPdfBlob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `Folium - ${currentFooterText.replace('FOLIUM · ', '') || 'dossier'}.pdf`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (e) {
      alert('Generazione PDF non riuscita: ' + (e.message || e) + '\n\nPuoi comunque usare "Stampa dal browser" nel frattempo.');
    } finally {
      btn.disabled = false; btn.textContent = original;
    }
  }

  async function checkAccessAndRender(){
    const { data: dossier } = await sb.from('folium_dossiers').select('id, client_id, is_shared').eq('id', dossierId).single();
    if (!dossier) { document.getElementById('content').textContent = 'Dossier non trovato.'; return; }

    const { data: { user } } = await sb.auth.getUser();
    const isOwnerAccount = (user?.email || '').toLowerCase() === OWNER_EMAIL;
    const isDossierOwner = user && user.id === dossier.client_id;

    if (isOwnerAccount || isDossierOwner) {
      document.getElementById('printBtn').style.display = '';
      document.getElementById('pdfBtn').style.display = '';
      // Link alla dashboard admin: SOLO per l'account sviluppatore, mai per il
      // proprietario del dossier che sta semplicemente vedendo il proprio lavoro.
      if (isOwnerAccount) document.getElementById('adminBtnView').style.display = '';
      // "Modifica" solo per il vero proprietario del dossier — l'account sviluppatore
      // che sta solo TESTANDO il dossier di qualcun altro non deve poterlo modificare.
      if (isDossierOwner) document.getElementById('editBtn').style.display = '';
      render('it');
      return;
    }

    // Visitatore esterno (es. investitore a cui l'agente ha mandato il link): gate attivo.
    document.getElementById('content').innerHTML = '';
    document.getElementById('leadGate').style.display = 'flex';
  }

  async function submitLeadGate(){
    const name = document.getElementById('leadName').value.trim();
    const email = document.getElementById('leadEmail').value.trim();
    const msg = document.getElementById('leadGateMsg');
    const btn = document.getElementById('leadSubmitBtn');
    if (!name || !email) { msg.textContent = 'Inserisci nome ed email.'; return; }

    btn.disabled = true; btn.textContent = 'Sblocco in corso…';
    try {
      const { data: dossier } = await sb.from('folium_dossiers').select('tenant_id').eq('id', dossierId).single();
      const { error } = await sb.from('folium_dossier_leads').insert({
        dossier_id: dossierId, tenant_id: dossier?.tenant_id, name, email
      });
      if (error) throw error;

      document.getElementById('leadGate').style.display = 'none';
      document.getElementById('printBtn').style.display = '';
      await render('it');
      window.print(); // avvia subito il download/salvataggio PDF come richiesto
    } catch (e) {
      msg.textContent = 'Errore: ' + (e.message || e);
      btn.disabled = false; btn.textContent = 'Sblocca e scarica';
    }
  }

  checkAccessAndRender();
</script>
