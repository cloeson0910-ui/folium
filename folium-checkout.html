<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOLIUM — Gold e Platinum</title>
<style>
  :root{--gold1:#8f6f2c;--gold2:#c79c43;--gold3:#f1d27a;--gold4:#a77d31;--bronze:#20180a;--bronze2:#3a2c14;--cream:#f6f2ea;--plat1:#5a6570;--plat2:#8b97a3;--plat3:#c7cfd6;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins',Arial,sans-serif;background:var(--cream);color:#2b2416;}
  header{background:radial-gradient(circle at 30% 20%, var(--bronze2), var(--bronze));padding:32px 18px;text-align:center;color:var(--gold3);}
  header .brand{font-weight:300;letter-spacing:4px;font-size:22px;background:linear-gradient(120deg,var(--gold1),var(--gold2),var(--gold3),var(--gold4));-webkit-background-clip:text;background-clip:text;color:transparent;}
  header p{font-size:13px;color:#e8dcb8;margin-top:8px;}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 60px;}
  .tier-block{margin-bottom:30px;}
  .tier-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .tier-head h2{font-size:16px;margin:0;letter-spacing:.5px;}
  .tier-head .dot{width:10px;height:10px;border-radius:50%;}
  .tier-head.gold .dot{background:linear-gradient(120deg,var(--gold1),var(--gold2));}
  .tier-head.platinum .dot{background:linear-gradient(120deg,var(--plat1),var(--plat2),var(--plat3));}
  .tier-desc{font-size:12px;color:#8a7a52;margin:-6px 0 14px;}
  .plan{background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.08);padding:20px;margin-bottom:14px;border:2px solid transparent;position:relative;}
  .plan.best{border-color:var(--gold2);}
  .plan.best.platinum-best{border-color:var(--plat2);}
  .plan .badge{position:absolute;top:-10px;right:16px;color:#fff;font-size:10px;padding:4px 10px;border-radius:12px;letter-spacing:1px;}
  .gold .plan .badge{background:linear-gradient(120deg,var(--gold1),var(--gold2));}
  .platinum .plan .badge{background:linear-gradient(120deg,var(--plat1),var(--plat2));}
  .plan h3{margin:0 0 4px;font-size:15px;}
  .plan .price{font-size:26px;font-weight:300;margin:6px 0 2px;}
  .gold .plan .price{color:var(--gold4);}
  .platinum .plan .price{color:var(--plat1);}
  .plan .price span{font-size:12.5px;color:#8a7a52;font-weight:400;}
  .plan .desc{font-size:12px;color:#8a7a52;margin-bottom:12px;}
  .plan button{width:100%;padding:12px;border:none;border-radius:9px;color:#fff;font-size:13px;letter-spacing:1px;cursor:pointer;}
  .gold .plan button{background:linear-gradient(120deg,var(--gold1),var(--gold2),var(--gold4));}
  .platinum .plan button{background:linear-gradient(120deg,var(--plat1),var(--plat2));}
  .plan button:disabled{opacity:.6;}
  .msg{font-size:13px;margin-top:14px;padding:10px;border-radius:8px;display:none;}
  .msg.err{background:#fbe4e4;color:#a33;display:block;}
</style>
</head>
<body>

<header>
  <div class="brand">FOLIUM</div>
  <p>Passa a Gold o Platinum</p>
</header>

<div class="wrap">

  <div id="goldBlock" class="tier-block gold"></div>
  <div id="platinumBlock" class="tier-block platinum"></div>
  <div id="showOtherTierLink" style="display:none;text-align:center;margin:-14px 0 20px;">
    <a href="folium-checkout.html" style="font-size:12.5px;color:#8a7a52;">← Vedi anche l'altro piano</a>
  </div>

  <div class="tier-block" style="margin-bottom:6px;">
    <label style="display:block;font-size:11px;letter-spacing:.5px;color:#8a7a52;margin-bottom:5px;text-transform:uppercase;">Codice promo</label>
    <div style="display:flex;gap:8px;">
      <input type="text" id="promoInput" placeholder="Hai un codice?" style="flex:1;padding:10px 12px;border:1px solid #ddd2b3;border-radius:8px;font-size:13px;text-transform:uppercase;">
      <button onclick="applyPromoCode()" style="padding:10px 16px;border:none;border-radius:8px;background:#efe8d8;color:#6b5314;font-size:12.5px;cursor:pointer;white-space:nowrap;">Applica</button>
    </div>
    <div id="promoStatus" style="font-size:12px;margin-top:6px;"></div>
  </div>

  <div id="msg" class="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://jgsmebtiwgwegjcytmee.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ToGgNAX4tIn6O7gb6hMa4A_kRi1yztz";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showMsg(text){
    const el = document.getElementById('msg');
    el.textContent = text; el.className = 'msg err';
    // Prima l'errore restava in fondo alla pagina, fuori dalla vista — sembrava che
    // il pulsante non facesse nulla. Ora lo scorre in vista automaticamente.
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // Codice promo: la validazione qui è SOLO per un feedback immediato all'utente (mostra lo
  // sconto prima di pagare). Il prezzo VERO viene ricalcolato e applicato lato server dentro
  // folium-create-checkout, che ripete la stessa validazione — mai fidarsi del client per
  // l'importo finale di un pagamento. TENANT_ID fisso, stesso usato in tutto Folium.
  const TENANT_ID = "724f71d8-b499-46c1-9047-021280e913c9";
  let appliedPromoCode = null;

  // Prezzi caricati da folium_pricing (modificabili dall'admin, mai più hardcoded qui).
  // Il conteggio dossier per tipo pacchetto resta fisso (non è un prezzo), il resto viene
  // dal DB. Il prezzo VERO addebitato lo ricalcola comunque folium-create-checkout.ts
  // lato server — questo serve solo a mostrare le card correttamente.
  const PACKAGE_COUNT = { single: 1, pack10: 10, pack50: 50 };
  const PACKAGE_DESC = {
    gold: { single: 'Un dossier Gold completo.', pack10: '10 dossier Gold da usare quando vuoi.', pack50: 'Per chi usa Folium regolarmente.' },
    platinum: { single: 'Un dossier Platinum completo.', pack10: '10 dossier Platinum da usare quando vuoi.', pack50: 'Per chi usa Folium regolarmente.' }
  };
  const PACKAGE_TITLE = { single: 'Dossier singolo', pack10: 'Pacchetto 10 dossier', pack50: 'Pacchetto 50 dossier' };

  async function renderPlans(){
    const { data } = await sb.from('folium_pricing').select('*').eq('tenant_id', TENANT_ID).eq('category', 'dossier_package');
    if (!data || !data.length) {
      document.getElementById('goldBlock').innerHTML = '<div class="tier-desc">Prezzi non disponibili al momento. Riprova tra poco.</div>';
      return;
    }
    // Legge ?tier=gold|platinum dalla query string (arrivando dalla landing
    // folium-plans.html) — PRIMA il parametro veniva semplicemente ignorato,
    // la pagina mostrava sempre entrambi i piani indipendentemente da cosa
    // l'utente avesse scelto. Se specificato e valido, mostra SOLO quel piano.
    const requestedTier = new URLSearchParams(window.location.search).get('tier');
    const tiersToShow = (requestedTier === 'gold' || requestedTier === 'platinum') ? [requestedTier] : ['gold', 'platinum'];
    if (tiersToShow.length === 1) document.getElementById('showOtherTierLink').style.display = 'block';
    ['gold', 'platinum'].forEach(tier => {
      if (!tiersToShow.includes(tier)) {
        document.getElementById(tier + 'Block').style.display = 'none';
        return;
      }
      const rows = data.filter(r => r.key.startsWith(tier + '_'));
      const tierClass = tier === 'platinum' ? 'platinum' : 'gold';
      const desc = tier === 'gold'
        ? 'Tutte le funzioni (popolazione, analisi di mercato AI, turismo/territorio) — con pagine pubblicitarie tra le sezioni e logo Folium.'
        : 'Tutte le funzioni, senza pagine pubblicitarie e senza logo Folium sul dossier.';
      const plansHTML = rows.map(r => {
        const packageType = r.key.replace(tier + '_', '');
        const unitPrice = (r.price_cents / 100);
        const count = PACKAGE_COUNT[packageType] || 1;
        const totalPrice = unitPrice * count;
        const fmt = (n) => n.toLocaleString('it-IT', { minimumFractionDigits: n % 1 ? 2 : 0 });
        const priceHTML = count === 1
          ? `${fmt(unitPrice)}€ <span>una tantum</span>`
          : `${fmt(unitPrice)}€ <span>/ cad. — ${fmt(totalPrice)}€ totali</span>`;
        const isBest = packageType === 'pack10';
        return `<div class="plan${isBest ? ' best' + (tier === 'platinum' ? ' platinum-best' : '') : ''}">
          ${isBest ? '<div class="badge">PIÙ SCELTO</div>' : ''}
          <h3>${PACKAGE_TITLE[packageType] || packageType}</h3>
          <div class="price">${priceHTML}</div>
          <div class="desc">${PACKAGE_DESC[tier][packageType] || ''}</div>
          <button onclick="startCheckout('${tier}','${packageType}', this)">Acquista</button>
        </div>`;
      }).join('');
      document.getElementById(tier + 'Block').innerHTML = `
        <div class="tier-head ${tierClass}"><span class="dot"></span><h2>FOLIUM ${tier === 'gold' ? 'Gold' : 'Platinum'}</h2></div>
        <div class="tier-desc">${desc}</div>
        ${plansHTML}`;
    });
  }
  renderPlans();

  async function applyPromoCode(){
    const input = document.getElementById('promoInput');
    const status = document.getElementById('promoStatus');
    const code = input.value.trim().toUpperCase();
    if (!code) { appliedPromoCode = null; status.textContent = ''; return; }

    const { data: promo, error } = await sb.from('folium_promo_codes')
      .select('*').eq('tenant_id', TENANT_ID).eq('code', code).eq('active', true).maybeSingle();

    const today = new Date().toISOString().slice(0, 10);
    if (error || !promo) {
      appliedPromoCode = null;
      status.innerHTML = '<span style="color:#a33;">Codice non valido.</span>';
      return;
    }
    if (promo.expires_at && promo.expires_at < today) {
      appliedPromoCode = null;
      status.innerHTML = '<span style="color:#a33;">Codice scaduto.</span>';
      return;
    }
    if (promo.max_uses != null && promo.uses_count >= promo.max_uses) {
      appliedPromoCode = null;
      status.innerHTML = '<span style="color:#a33;">Codice esaurito.</span>';
      return;
    }

    appliedPromoCode = code;
    const discountLabel = promo.discount_type === 'percentage' ? `-${promo.discount_value}%` : `-${promo.discount_value}€`;
    status.innerHTML = `<span style="color:#2f7d3a;">Codice applicato: ${discountLabel} — sarà calcolato sul totale al passaggio a Stripe.</span>`;
  }

  async function startCheckout(tier, packageType, clickedBtn){
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { window.location.href = 'folium-register.html'; return; }

    // Feedback visivo IMMEDIATO al click: prima non c'era nulla, un errore poteva
    // comparire in fondo alla pagina (fuori dalla vista) dando l'impressione che
    // "non succedesse niente" anche quando in realtà qualcosa falliva subito.
    const originalBtnText = clickedBtn ? clickedBtn.textContent : null;
    if (clickedBtn) { clickedBtn.disabled = true; clickedBtn.textContent = 'Attendere…'; }

    try {
      const { data, error } = await sb.functions.invoke('folium-create-checkout', {
        body: { tier, package_type: packageType, promo_code: appliedPromoCode || null }
      });
      if (error) throw error;
      if (data?.url) {
        window.location.href = data.url; // redirect a Stripe Checkout
      } else {
        throw new Error('URL di pagamento non ricevuto');
      }
    } catch (err) {
      showMsg('Errore avvio pagamento: ' + (err.message || err));
      if (clickedBtn) { clickedBtn.disabled = false; clickedBtn.textContent = originalBtnText; }
    }
  }
</script>
</body>
</html>
